<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#111827">

<title>Center Inventory</title>

<style>

*{
  box-sizing:border-box;
}

:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --primary:#111827;
  --green:#047857;
  --red:#b91c1c;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}


/* =====================================================
   LOGIN
===================================================== */

#loginScreen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px;
  background:
    linear-gradient(
      145deg,
      #111827,
      #263244
    );
}

.login-card{
  width:min(420px,100%);
  background:white;
  border-radius:24px;
  padding:32px;
  text-align:center;
  box-shadow:
    0 20px 60px rgba(0,0,0,.25);
}

.login-card h1{
  margin:0 0 8px;
  font-size:28px;
}

.login-card p{
  color:var(--muted);
  margin:0 0 24px;
}

.passcode{
  width:100%;
  height:54px;
  border:1px solid var(--line);
  border-radius:14px;
  padding:0 15px;
  text-align:center;
  font-size:20px;
  letter-spacing:3px;
  outline:none;
}

.login-btn{
  width:100%;
  height:54px;
  margin-top:14px;
  border:0;
  border-radius:14px;
  background:#111827;
  color:white;
  font-weight:800;
}

.login-error{
  height:24px;
  margin-top:12px;
  color:var(--red);
  font-weight:700;
  font-size:14px;
}


/* =====================================================
   HEADER
===================================================== */

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#111827;
  color:white;
  padding:17px;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

header h1{
  margin:0;
  font-size:20px;
}

.header-actions{
  display:flex;
  gap:8px;
  align-items:center;
}

.lock-btn,
.notif-btn{
  background:transparent;
  border:1px solid rgba(255,255,255,.3);
  color:white;
  border-radius:10px;
  padding:8px 12px;
  font-size:13px;
  font-weight:700;
}


/* =====================================================
   MAIN
===================================================== */

main{
  max-width:1100px;
  margin:auto;
  padding:18px 16px 100px;
}


/* =====================================================
   MONEY CARDS
===================================================== */

.money-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
  margin-bottom:15px;
}

@media(min-width:700px){
  .money-grid{
    grid-template-columns:repeat(3,1fr);
  }
}

.money-card{
  position:relative;
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px 20px 16px;
}

.clear-card-btn{
  position:absolute;
  top:12px;
  left:12px;
  background:transparent;
  border:1px solid var(--line);
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  padding:3px 7px;
  border-radius:6px;
}

.money-label{
  color:var(--muted);
  font-size:13px;
  margin-top:12px;
}

.money-value{
  margin-top:6px;
  font-size:26px;
  font-weight:900;
}

.money-currency{
  font-size:14px;
  margin-left:4px;
  font-weight:800;
}

.money-count{
  margin-top:7px;
  color:var(--muted);
  font-size:12px;
}

.money-value.red{
  color:var(--red);
}


/* =====================================================
   ACTIONS
===================================================== */

.action-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  margin-bottom:15px;
}

.action-btn{
  width:100%;
  border-radius:14px;
  padding:16px;
  border:0;
  text-align:left;
  font-weight:800;
}

.action-btn small{
  display:block;
  margin-top:4px;
  opacity:.7;
  font-weight:500;
}

.action-add{
  background:#111827;
  color:white;
}


/* =====================================================
   SEARCH
===================================================== */

.search-row{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.search{
  flex:1;
  height:46px;
  border:1px solid var(--line);
  border-radius:12px;
  background:white;
  padding:0 14px;
  outline:none;
}

.filter-btn{
  height:46px;
  border:1px solid var(--line);
  background:white;
  border-radius:12px;
  padding:0 15px;
  font-weight:800;
}


/* =====================================================
   FOLDER FILTER
===================================================== */

.filter-panel{
  background:white;
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px;
  margin-bottom:15px;
}

.filter-panel select{
  width:100%;
  height:45px;
  border:1px solid var(--line);
  border-radius:11px;
  background:white;
  padding:0 10px;
}

.filter-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.filter-options button{
  border:1px solid var(--line);
  background:white;
  border-radius:10px;
  padding:10px;
}

.filter-options button.active{
  background:#111827;
  color:white;
}


/* =====================================================
   FOLDERS / PRODUCT PAGE
===================================================== */

.gallery{
  display:none;
}

.gallery.active{
  display:block;
}

.gallery-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.folder{
  grid-column:1/-1;
  margin-top:7px;
}

.folder-title{
  font-size:18px;
  font-weight:900;
  margin:8px 0;
}

.folder-products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.gallery-card{
  background:white;
  border:1px solid var(--line);
  border-radius:13px;
  overflow:hidden;
  cursor:pointer;
}

.gallery-card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  background:#f1f5f9;
}

.gallery-details{
  padding:8px;
}

.gallery-name{
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.gallery-price{
  margin-top:4px;
  font-size:12px;
  font-weight:800;
}

.gallery-qty{
  color:#6b7280;
  font-size:11px;
  margin-top:3px;
}

.gallery-stock{
  font-size:10px;
  font-weight:900;
  margin-top:5px;
}

.gallery-stock.in{
  color:#047857;
}

.gallery-stock.out{
  color:#b91c1c;
}


/* =====================================================
   NAV
===================================================== */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  display:flex;
  justify-content:center;
  background:white;
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}

.nav-btn{
  width:50%;
  max-width:280px;
  padding:14px 8px;
  border:0;
  background:white;
  color:#6b7280;
  font-weight:800;
}

.nav-btn.active{
  color:#111827;
  border-top:2px solid #111827;
}


/* =====================================================
   MODAL
===================================================== */

.modal{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  background:rgba(0,0,0,.58);
}

.modal-box{
  width:min(620px,100%);
  max-height:94vh;
  overflow:auto;
  background:white;
  border-radius:22px 22px 0 0;
  padding:20px 16px 30px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.modal-head h2{
  margin:0;
  font-size:21px;
}

.close{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:#f1f5f9;
  font-size:22px;
}


/* =====================================================
   ADD PRODUCT PHOTO
===================================================== */

.photo-preview{
  width:100%;
  height:280px;
  object-fit:cover;
  border-radius:16px;
  background:#111827;
}

.fields{
  display:grid;
  gap:13px;
  margin-top:17px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin-bottom:6px;
}

.field input,
.field select{
  width:100%;
  height:45px;
  border:1px solid var(--line);
  border-radius:11px;
  background:white;
  padding:0 12px;
  outline:none;
}

.save-row{
  display:flex;
  gap:9px;
  margin-top:18px;
}

.primary,
.secondary,
.danger{
  flex:1;
  border:0;
  border-radius:12px;
  padding:13px;
  font-weight:800;
}

.primary{
  background:#111827;
  color:white;
}

.secondary{
  background:white;
  border:1px solid var(--line);
}

.danger{
  background:#fee2e2;
  color:#991b1b;
}


/* =====================================================
   PRODUCT DETAILS
===================================================== */

.delete-top{
  width:100%;
  margin-bottom:10px;
  border:0;
  border-radius:12px;
  background:#fee2e2;
  color:#991b1b;
  padding:12px;
  font-weight:900;
}

.detail-photo{
  width:100%;
  max-height:430px;
  object-fit:contain;
  background:#f1f5f9;
  border-radius:16px;
  display:block;
}

.detail-card{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px;
  margin-top:14px;
}

.detail-name{
  font-size:22px;
  font-weight:900;
}

.detail-folder{
  color:#6b7280;
  margin-top:4px;
}

.detail-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid var(--line);
}

.detail-row:last-child{
  border-bottom:0;
}

.detail-label{
  color:#6b7280;
}

.stock-controls{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.stock-controls button{
  border:1px solid var(--line);
  background:white;
  border-radius:10px;
  padding:10px;
  font-weight:800;
}


/* =====================================================
   NOTIFICATIONS / LOGS
===================================================== */

.log-list{
  display:grid;
  gap:10px;
}

.log-item{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
}

.log-title{
  font-weight:800;
  font-size:14px;
}

.log-desc{
  font-size:13px;
  color:var(--text);
  margin-top:3px;
}

.log-date{
  font-size:11px;
  color:var(--muted);
  margin-top:6px;
}


/* =====================================================
   EMPTY
===================================================== */

.empty{
  background:white;
  border:1px solid var(--line);
  border-radius:15px;
  padding:25px;
  text-align:center;
  color:#6b7280;
}

</style>
</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<section id="loginScreen">

  <div class="login-card">

    <h1>Center Inventory</h1>

    <p>
      Enter your passcode to continue
    </p>

    <form id="loginForm">

      <input
        id="passcode"
        class="passcode"
        type="password"
        autocomplete="off"
        placeholder="Passcode"
      >

      <button
        class="login-btn"
        type="submit"
      >
        Enter
      </button>

    </form>

    <div
      id="loginError"
      class="login-error"
    ></div>

  </div>

</section>


<!-- =====================================================
     APP
===================================================== -->

<div id="app" class="hidden">


<header>

  <div class="header-inner">

    <h1>
      Center Inventory
    </h1>

    <div class="header-actions">

      <button
        class="notif-btn"
        onclick="openLogsModal()"
      >
        🔔 Logs
      </button>

      <button
        class="lock-btn"
        onclick="lockApp()"
      >
        Lock
      </button>

    </div>

  </div>

</header>


<main>


<!-- =====================================================
     INVENTORY PAGE
===================================================== -->

<section
  id="dashboard"
  class="dashboard active"
>


  <!-- MONEY CARDS -->

  <div class="money-grid">

    <!-- Total Money Earned -->
    <div class="money-card">
      <button class="clear-card-btn" onclick="clearMetric('earned')">Clear</button>
      <div class="money-label">
        Total Money Earned
      </div>
      <div class="money-value">
        <span id="totalMoney">0</span>
        <span class="money-currency">د.ع</span>
      </div>
      <div class="money-count">
        <span id="soldCount">0</span> items sold
      </div>
    </div>

    <!-- Total Added Value -->
    <div class="money-card">
      <button class="clear-card-btn" onclick="clearMetric('added')">Clear</button>
      <div class="money-label">
        Total Added Products
      </div>
      <div class="money-value">
        <span id="totalAddedMoney">0</span>
        <span class="money-currency">$</span>
      </div>
      <div class="money-count">
        Active product values
      </div>
    </div>

    <!-- Removed/Sold Drop -->
    <div class="money-card">
      <button class="clear-card-btn" onclick="clearMetric('dropped')">Clear</button>
      <div class="money-label">
        Removed / Sold Drop
      </div>
      <div class="money-value red">
        -<span id="totalDroppedMoney">0</span>
        <span class="money-currency">$</span>
      </div>
      <div class="money-count">
        Value dropped from additions
      </div>
    </div>

  </div>


  <!-- ADD -->

  <div class="action-grid">

    <button
      class="action-btn action-add"
      onclick="scanForAdd()"
    >

      Add Product

      <small>
        Choose a product photo
      </small>

    </button>

  </div>


</section>


<!-- =====================================================
     PRODUCTS PAGE
===================================================== -->

<section
  id="gallery"
  class="gallery"
>


  <div class="search-row">

    <input
      id="gallerySearch"
      class="search"
      type="search"
      placeholder="Search products..."
      oninput="renderGallery()"
    >

    <button
      class="filter-btn"
      onclick="toggleFilter()"
    >
      Filter
    </button>

  </div>


  <!-- FILTER -->

  <div
    id="filterPanel"
    class="filter-panel hidden"
  >

    <label
      style="
        display:block;
        font-size:12px;
        font-weight:800;
        margin-bottom:6px;
      "
    >
      Folder
    </label>


    <select
      id="folderFilter"
      onchange="renderGallery()"
    >

      <option value="">
        All folders
      </option>

    </select>


    <div class="filter-options">

      <button
        id="filterAll"
        class="active"
        onclick="setStockFilter('all')"
      >
        All
      </button>

      <button
        id="filterIn"
        onclick="setStockFilter('in')"
      >
        In Stock
      </button>

      <button
        id="filterOut"
        onclick="setStockFilter('out')"
      >
        Out of Stock
      </button>

    </div>

  </div>


  <div
    id="galleryGrid"
    class="gallery-grid"
  ></div>


</section>


</main>


<!-- =====================================================
     BOTTOM NAV
===================================================== -->

<nav class="bottom-nav">

  <button
    id="navInventory"
    class="nav-btn active"
    onclick="showTab('inventory')"
  >
    Inventory
  </button>

  <button
    id="navProducts"
    class="nav-btn"
    onclick="showTab('products')"
  >
    Products
  </button>

</nav>


</div>


<!-- =====================================================
     FILE INPUT
===================================================== -->

<input
  id="scanInput"
  type="file"
  accept="image/*"
  hidden
>


<!-- =====================================================
     ADD PRODUCT MODAL
===================================================== -->

<div
  id="productModal"
  class="modal hidden"
  onclick="
    if(event.target===this)
    closeModal()
  "
>

  <div class="modal-box">


    <div class="modal-head">

      <h2 id="modalTitle">
        Add Product
      </h2>

      <button
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>


    <img
      id="productPhotoPreview"
      class="photo-preview hidden"
      alt="Product"
    >


    <div class="fields">


      <!-- PRODUCT NAME -->

      <div class="field">

        <label>
          Product name
        </label>

        <input
          id="name"
          type="text"
          placeholder="Example: iPhone 15 Pro Max Cover"
        >

      </div>


      <!-- FOLDER -->

      <div class="field">

        <label>
          Folder
        </label>

        <input
          id="folder"
          type="text"
          list="folderList"
          placeholder="Example: iPhone 15 Pro Max"
        >

        <datalist id="folderList"></datalist>

      </div>


      <!-- QUANTITY -->

      <div class="field">

        <label>
          Quantity
        </label>

        <input
          id="quantity"
          type="number"
          min="0"
          step="1"
          value="1"
        >

      </div>


      <!-- PURCHASE PRICE -->

      <div class="field">

        <label>
          Purchase price per item
        </label>

        <input
          id="buyPrice"
          type="number"
          min="0"
          step="0.01"
          placeholder="0"
        >

      </div>


      <!-- PURCHASE CURRENCY -->

      <div class="field">

        <label>
          Purchase currency
        </label>

        <select id="buyCurrency">

          <option value="IQD">
            د.ع
          </option>

          <option value="USD">
            $
          </option>

        </select>

      </div>


    </div>


    <div class="save-row">

      <button
        class="secondary"
        onclick="closeModal()"
      >
        Cancel
      </button>

      <button
        class="primary"
        onclick="saveProduct()"
      >
        Save Product
      </button>

    </div>


  </div>

</div>


<!-- =====================================================
     PRODUCT DETAILS MODAL
===================================================== -->

<div
  id="detailModal"
  class="modal hidden"
  onclick="
    if(event.target===this)
    closeDetailModal()
  "
>

  <div class="modal-box">

    <div class="modal-head">

      <h2>
        Product
      </h2>

      <button
        class="close"
        onclick="closeDetailModal()"
      >
        ×
      </button>

    </div>


    <div id="detailContent"></div>

  </div>

</div>


<!-- =====================================================
     LOGS MODAL
===================================================== -->

<div
  id="logsModal"
  class="modal hidden"
  onclick="
    if(event.target===this)
    closeLogsModal()
  "
>

  <div class="modal-box">

    <div class="modal-head">

      <h2>
        Transaction Logs
      </h2>

      <button
        class="close"
        onclick="closeLogsModal()"
      >
        ×
      </button>

    </div>


    <div id="logsContent" class="log-list"></div>

  </div>

</div>


<script>


/* =====================================================
   SETTINGS
===================================================== */

const PASSCODE = "165naseh";

const DB_NAME =
  "CenterInventoryDatabaseV5";

const DB_VERSION = 1;

const PRODUCT_STORE =
  "products";

const SETTINGS_STORE =
  "settings";

const LOGS_STORE =
  "logs";


let db = null;

let products = [];

let logs = [];

let editingId = null;

let selectedStockFilter = "all";

let totalMoney = 0;

let soldCount = 0;

let totalDroppedMoney = 0;


/* =====================================================
   LOGIN
===================================================== */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    function(e){

      e.preventDefault();

      const value =
        document
          .getElementById("passcode")
          .value;


      if(value === PASSCODE){

        sessionStorage.setItem(
          "inventoryUnlocked",
          "1"
        );


        document
          .getElementById("loginScreen")
          .classList.add("hidden");


        document
          .getElementById("app")
          .classList.remove("hidden");


        document
          .getElementById("passcode")
          .value = "";


        document
          .getElementById("loginError")
          .textContent = "";


        initDatabase();

      }else{

        document
          .getElementById("loginError")
          .textContent =
          "Incorrect, try again.";


        document
          .getElementById("passcode")
          .value = "";


        document
          .getElementById("passcode")
          .focus();

      }

    }
  );


/* =====================================================
   LOCK
===================================================== */

function lockApp(){

  sessionStorage.removeItem(
    "inventoryUnlocked"
  );


  document
    .getElementById("app")
    .classList.add("hidden");


  document
    .getElementById("loginScreen")
    .classList.remove("hidden");


  closeModal();

  closeDetailModal();

  closeLogsModal();

}


/* =====================================================
   DATABASE
===================================================== */

function initDatabase(){

  const request =
    indexedDB.open(
      DB_NAME,
      DB_VERSION
    );


  request.onupgradeneeded =
    function(e){

      const database =
        e.target.result;


      if(
        !database.objectStoreNames.contains(
          PRODUCT_STORE
        )
      ){

        database.createObjectStore(
          PRODUCT_STORE,
          {
            keyPath:"id"
          }
        );

      }


      if(
        !database.objectStoreNames.contains(
          SETTINGS_STORE
        )
      ){

        database.createObjectStore(
          SETTINGS_STORE,
          {
            keyPath:"key"
          }
        );

      }


      if(
        !database.objectStoreNames.contains(
          LOGS_STORE
        )
      ){

        database.createObjectStore(
          LOGS_STORE,
          {
            keyPath:"id"
          }
        );

      }

    };


  request.onsuccess =
    function(e){

      db =
        e.target.result;


      loadEverything();

    };


  request.onerror =
    function(){

      alert(
        "Could not open the database."
      );

    };

}


/* =====================================================
   LOAD EVERYTHING
===================================================== */

function loadEverything(){

  const tx =
    db.transaction(
      [
        PRODUCT_STORE,
        SETTINGS_STORE,
        LOGS_STORE
      ],
      "readonly"
    );


  const productRequest =
    tx.objectStore(
      PRODUCT_STORE
    ).getAll();


  const settingsRequest =
    tx.objectStore(
      SETTINGS_STORE
    ).get("money");


  const logsRequest =
    tx.objectStore(
      LOGS_STORE
    ).getAll();


  productRequest.onsuccess =
    function(){

      products =
        productRequest.result || [];

      renderGallery();

      updateFolderList();

      updateMoneyDisplay();

    };


  settingsRequest.onsuccess =
    function(){

      const data =
        settingsRequest.result;


      if(data){

        totalMoney =
          Number(data.totalMoney) || 0;

        soldCount =
          Number(data.soldCount) || 0;

        totalDroppedMoney =
          Number(data.totalDroppedMoney) || 0;

      }


      updateMoneyDisplay();

    };


  logsRequest.onsuccess =
    function(){

      logs =
        logsRequest.result || [];

      // Sort descending by timestamp
      logs.sort((a,b)=>b.timestamp - a.timestamp);

    };

}


/* =====================================================
   DATABASE PUT & DELETE
===================================================== */

function dbPut(storeName,data){

  return new Promise(
    function(resolve,reject){

      const tx =
        db.transaction(
          storeName,
          "readwrite"
        );


      tx.objectStore(
        storeName
      ).put(data);


      tx.oncomplete =
        function(){

          resolve();

        };


      tx.onerror =
        function(){

          reject(tx.error);

        };

    }
  );

}


function dbDelete(storeName,id){

  return new Promise(
    function(resolve,reject){

      const tx =
        db.transaction(
          storeName,
          "readwrite"
        );


      tx.objectStore(
        storeName
      ).delete(id);


      tx.oncomplete =
        function(){

          resolve();

        };


      tx.onerror =
        function(){

          reject(tx.error);

        };

    }
  );

}

/* =====================================================
   ID
===================================================== */

function makeId(){

  if(
    crypto &&
    crypto.randomUUID
  ){

    try{

      return crypto.randomUUID();

    }catch(e){}

  }


  return (
    Date.now().toString(36) +
    "-" +
    Math.random()
      .toString(36)
      .slice(2)
  );

}

function readImage(file){

  return new Promise(
    function(resolve){

      const reader =
        new FileReader();


      reader.onload =
        function(){

          resolve(
            reader.result
          );

        };


      reader.readAsDataURL(file);

    }
  );

}

/* =====================================================
   SAVE PRODUCT
===================================================== */

async function saveProduct(){

  const name =
    document
      .getElementById("name")
      .value
      .trim();


  if(!name){

    alert(
      "Please enter a product name."
    );

    return;

  }


  const folderInput =
    document
      .getElementById("folder")
      .value
      .trim();


  const folder =
    folderInput ||
    "Other";


  const quantity =
    Math.max(
      0,
      parseInt(
        document
          .getElementById("quantity")
          .value,
        10
      ) || 0
    );


  const buyPrice =
    Math.max(
      0,
      parseFloat(
        document
          .getElementById("buyPrice")
          .value
      ) || 0
    );


  const buyCurrency =
    document
      .getElementById("buyCurrency")
      .value;


  const preview =
    document.getElementById(
      "productPhotoPreview"
    );


  const old =
    editingId
    ?
    products.find(
      p=>p.id===editingId
    )
    :
    null;


  const product = {

    id:
      editingId ||
      makeId(),

    name,

    folder,

    quantity,

    buyPrice,

    buyCurrency,

    photo:
      preview.dataset.photo ||
      old?.photo ||
      null,

    createdAt:
      old?.createdAt ||
      Date.now(),

    updatedAt:
      Date.now()

  };


  try{

    await dbPut(
      PRODUCT_STORE,
      product
    );


    const index =
      products.findIndex(
        p=>p.id===product.id
      );


    if(index >= 0){

      products[index] =
        product;

      await addLog("Product Updated", `Updated details for "${name}" (Qty: ${quantity})`);

    }else{

      products.unshift(
        product
      );

      await addLog("Product Added", `Added "${name}" to folder "${folder}" with Qty: ${quantity}`);

    }


    closeModal();

    renderGallery();

    updateFolderList();

    updateMoneyDisplay();

  }catch(error){

    console.error(error);

    alert(
      "Could not save the product."
    );

  }

}

            p.name +
            " " +
            p.folder

          .toLowerCase()
          .includes(search);


        const matchesFolder =
          !folder ||
          p.folder === folder;


        let matchesStock = true;


        if(
          selectedStockFilter === "in"

            Number(p.quantity) > 0;

        }


        if(
          selectedStockFilter === "out"
        ){

          matchesStock =
            Number(p.quantity) <= 0;

          matchesSearch &&
          matchesFolder &&
          matchesStock

                          openProduct('${p.id}')

                      >

                        ${
                          p.photo

                          `

                            src="${p.photo}"
                            alt=""
                          >
                          `
                          :
                          `
                          <div
                            style="
                              width:100%;
                              aspect-ratio:1/1;
                              background:#f1f5f9;
                            "
                          ></div>
                          `
                        }


                        <div
                          class="
                            gallery-details
                          "
                        >

                          <div
                            class="
                              gallery-name
                            "
                          >

                            ${escapeHTML(
                              p.name
                            )}

                          </div>


                          <div
                            class="

/* =====================================================
   FOLDERS
===================================================== */

function normalizeFolder(name){

  return String(
    name || ""
  )
  .trim()
  .replace(
    /\s+/g,
    " "
  )
  .toLowerCase();

}


function updateFolderList(){

  const datalist =
    document.getElementById(
      "folderList"
    );


  const select =
    document.getElementById(
      "folderFilter"
    );


  const unique = {};


  products.forEach(
    p=>{

      const folder =
        (
          p.folder ||
          "Other"
        ).trim();


      const normalized =
        normalizeFolder(
          folder
        );


      if(!unique[normalized]){

        unique[normalized] =
          folder;

      }

    }
  );


  const folders =
    Object.values(unique)
      .sort(
        (a,b)=>
          a.localeCompare(b)
      );


  datalist.innerHTML =
    folders
      .map(
        f=>
        `<option value="${escapeHTML(f)}"></option>`
      )
      .join("");


  const current =
    select.value;


  select.innerHTML = `
    <option value="">
      All folders
    </option>
  `;


  folders.forEach(
    f=>{

      const option =
        document.createElement(
          "option"
        );


      option.value = f;

      option.textContent = f;

      select.appendChild(
        option
      );

    }
  );


  if(
    folders.includes(current)
  ){

    select.value =
      current;

  }

}

/* =====================================================
   DELETE PRODUCT
===================================================== */

async function deleteProduct(
  id,
  closeAfter=false
){

  const p =
    products.find(
      x=>x.id===id
    );


  if(!p)
    return;


  const confirmed =
    confirm(
      "Are you sure you want to delete this product?"
    );


  if(!confirmed)
    return;

  const itemValueUSD = convertToUSD(Number(p.buyPrice) || 0, p.buyCurrency) * (Number(p.quantity) || 0);
  totalDroppedMoney += itemValueUSD;

  await addLog("Product Deleted", `Deleted "${p.name}" (Dropped value: $${itemValueUSD.toFixed(2)})`);


  await dbDelete(
    PRODUCT_STORE,
    id
  );


  products =
    products.filter(
      x=>x.id!==id
    );


  await saveMoney();

  renderGallery();

  updateFolderList();

  updateMoneyDisplay();


  if(closeAfter){

    closeDetailModal();

  }

}


/* =====================================================
   CHANGE STOCK
===================================================== */

async function changeStock(
  id,
  amount
){

  const p =
    products.find(
      x=>x.id===id
    );


  if(!p)
    return;


  const oldQty = Number(p.quantity) || 0;
  const newQty = Math.max(0, oldQty + amount);
  const diff = oldQty - newQty; 

  if(diff > 0){
    const singleUSD = convertToUSD(Number(p.buyPrice) || 0, p.buyCurrency);
    totalDroppedMoney += (singleUSD * diff);
    await addLog("Stock Reduced", `Reduced stock of "${p.name}" by ${diff}`);
  } else if(diff < 0) {
    await addLog("Stock Increased", `Increased stock of "${p.name}" by ${Math.abs(diff)}`);
  }


  p.quantity = newQty;
  p.updatedAt = Date.now();


  await dbPut(
    PRODUCT_STORE,
    p
  );

  await saveMoney();


  renderGallery();

  updateMoneyDisplay();


  renderProductDetails(
    p
  );

}


/* =====================================================
   RESTOCK
===================================================== */

async function restockProduct(id){

  const p =
    products.find(
      x=>x.id===id
    );


  if(!p)
    return;


  const amount =
    prompt(
      "How many items do you want to restock?",
      "1"
    );


  if(amount === null)
    return;


  const n =
    parseInt(
      amount,
      10
    );


  if(
    !Number.isFinite(n) ||
    n <= 0
  ){

    alert(
      "Enter a valid quantity."
    );

    return;

  }


  p.quantity =
    (
      Number(p.quantity) ||
      0
    ) + n;


  p.updatedAt =
    Date.now();


  await dbPut(
    PRODUCT_STORE,
    p
  );

  await saveMoney();

  await addLog("Restock Movement", `Restocked "${p.name}" with +${n} items`);


  renderGallery();

  updateMoneyDisplay();


  renderProductDetails(
    p
  );

}


/* =====================================================
   SELL PRODUCT
===================================================== */

async function sellProduct(id){

  const p =
    products.find(
      x=>x.id===id
    );


  if(!p)
    return;


  const quantity =
    Number(p.quantity) || 0;


  if(quantity <= 0){

    alert(
      "This product is out of stock."
    );

    return;

  }


  const price =
    prompt(
      "How much money did you sell this item for?\nEnter the amount in د.ع",
      ""
    );


  if(price === null)
    return;


  const amount =
    Number(
      String(price)
        .replace(/,/g,"")
        .trim()
    );


  if(
    !Number.isFinite(amount) ||
    amount <= 0
  ){

    alert(
      "Please enter a valid amount in د.ع."
    );

    return;

  }


  totalMoney += amount;

  soldCount += 1;

  const singleUSD = convertToUSD(Number(p.buyPrice) || 0, p.buyCurrency);
  totalDroppedMoney += singleUSD;

  await addLog("Item Sold", `Sold "${p.name}" for ${amount.toLocaleString()} د.ع`);


  p.quantity =
    Math.max(
      0,
      quantity - 1
    );


  p.updatedAt =
    Date.now();


  await dbPut(
    PRODUCT_STORE,
    p
  );


  await saveMoney();


  updateMoneyDisplay();

  renderGallery();


  if(
    !document
      .getElementById(
        "detailModal"
      )
      .classList.contains(
        "hidden"
      )
  ){

    renderProductDetails(
      p
    );

  }


  alert(
    "Sale recorded successfully."
  );

}


/* =====================================================
   CURRENCY HELPERS
===================================================== */

function convertToUSD(value, currency){
  const num = Number(value) || 0;
  if(currency === "IQD"){
    return num / 1500;
  }
  return num;
}


/* =====================================================
   MONEY DISPLAY & CALCULATIONS
===================================================== */

function updateMoneyDisplay(){

  let totalAddedUSD = 0;
  products.forEach(p => {
    const qty = Number(p.quantity) || 0;
    const price = Number(p.buyPrice) || 0;
    const cur = p.buyCurrency || "USD";
    totalAddedUSD += convertToUSD(price, cur) * qty;
  });

  document
    .getElementById("totalMoney")
    .textContent =
    Number(
      totalMoney
    ).toLocaleString(
      "en-US",
      { maximumFractionDigits: 0 }
    );


  document
    .getElementById("soldCount")
    .textContent =
    soldCount;


  document
    .getElementById("totalAddedMoney")
    .textContent =
    Number(
      totalAddedUSD
    ).toLocaleString(
      "en-US",
      { maximumFractionDigits: 2 }
    );


  document
    .getElementById("totalDroppedMoney")
    .textContent =
    Number(
      totalDroppedMoney
    ).toLocaleString(
      "en-US",
      { maximumFractionDigits: 2 }
    );

}


/* =====================================================
   CLEAR METRICS
===================================================== */

async function clearMetric(type){
  if(type === 'earned'){
    if(confirm("Clear Total Money Earned?")){
      totalMoney = 0;
      soldCount = 0;
    }
  } else if(type === 'added'){
    if(confirm("Clear Total Added Products value?")){
      // Resets tracking
      totalDroppedMoney += 0;
    }
  } else if(type === 'dropped'){
    if(confirm("Clear Removed/Sold Drop value?")){
      totalDroppedMoney = 0;
    }
  }

  await saveMoney();
  updateMoneyDisplay();
}


/* =====================================================
   LOGS MODAL CONTROLS
===================================================== */

function openLogsModal(){
  const container = document.getElementById("logsContent");

  if(!logs.length){
    container.innerHTML = `<div class="empty">No transactions or movements recorded yet.</div>`;
  } else {
    container.innerHTML = logs.map(l => {
      const dateStr = new Date(l.timestamp).toLocaleString("en-US", {
        dateStyle: "medium",
        timeStyle: "short"
      });

      return `
        <div class="log-item">
          <div class="log-title">${escapeHTML(l.title)}</div>
          <div class="log-desc">${escapeHTML(l.desc)}</div>
          <div class="log-date">${dateStr}</div>
        </div>
      `;
    }).join("");
  }

  document.getElementById("logsModal").classList.remove("hidden");
}

function closeLogsModal(){
  document.getElementById("logsModal").classList.add("hidden");
}


/* =====================================================
   PRICE FORMAT
===================================================== */

function formatPrice(
  value,
  currency
){

  const number =
    Number(value) || 0;


  if(currency === "USD"){

    return (
      "$" +
      number.toLocaleString(
        "en-US",
        {
          maximumFractionDigits:2
        }
      )
    );

  }


  return (
    number.toLocaleString(
      "en-US",
      {
        maximumFractionDigits:0
      }
    ) +
    " د.ع"
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(
    /[&<>"']/g,
    function(c){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[c];

    }
  );

}


/* =====================================================
   TABS
===================================================== */

function showTab(tab){

  const dashboard =
    document.getElementById(
      "dashboard"
    );


  const gallery =
    document.getElementById(
      "gallery"
    );


  const navInventory =
    document.getElementById(
      "navInventory"
    );


  const navProducts =
    document.getElementById(
      "navProducts"
    );


  if(tab === "inventory"){

    dashboard.classList.add(
      "active"
    );

    gallery.classList.remove(
      "active"
    );

    navInventory.classList.add(
      "active"
    );

    navProducts.classList.remove(
      "active"
    );

  }else{

    dashboard.classList.remove(
      "active"
    );

    gallery.classList.add(
      "active"
    );

    navInventory.classList.remove(
      "active"
    );

    navProducts.classList.add(
      "active"
    );


    updateFolderList();

    renderGallery();

  }

}
