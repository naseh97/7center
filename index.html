<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#090d16">
<title>7 Center</title>
<style>
:root{
  --bg:#090d16;
  --card:#111827;
  --text:#f3f4f6;
  --muted:#9ca3af;
  --line:#1f2937;
  --primary:#3b82f6;
  --primary-hover:#2563eb;
  --green:#10b981;
  --red:#ef4444;
  --radius:14px;
  --shadow:0 10px 25px -5px rgba(0,0,0,0.3);
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;}
button{cursor:pointer; transition:all 0.15s ease;}
button:active{transform:scale(0.97);}
.hidden{display:none!important;}

/* LOGIN */
#loginScreen{
  min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px;
  background:radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
}
.login-card{
  width:min(380px,100%); background:var(--card); border:1px solid var(--line);
  border-radius:20px; padding:32px; text-align:center; box-shadow:var(--shadow);
}
.login-card h1{margin:0 0 6px; font-size:24px; font-weight:800; letter-spacing:-0.5px;}
.login-card p{color:var(--muted); margin:0 0 20px; font-size:13px;}
.passcode{
  width:100%; height:48px; border:1px solid var(--line); border-radius:12px;
  background:#030712; color:white; padding:0 15px; text-align:center; font-size:18px; letter-spacing:4px; outline:none;
}
.passcode:focus{border-color:var(--primary);}
.login-btn{
  width:100%; height:48px; margin-top:12px; border:0; border-radius:12px;
  background:var(--primary); color:white; font-weight:700; font-size:14px;
}
.login-btn:hover{background:var(--primary-hover);}
.login-error{height:20px; margin-top:10px; color:var(--red); font-weight:600; font-size:12px;}

/* HEADER */
header{
  position:sticky; top:0; z-index:20; background:rgba(9,13,22,0.85); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line); padding:12px 16px;
}
.header-inner{max-width:1000px; margin:auto; display:flex; align-items:center; justify-content:space-between;}
header h1{margin:0; font-size:16px; font-weight:800; letter-spacing:-0.3px;}
.header-actions{display:flex; gap:6px;}
.header-actions button{
  background:var(--line); border:0; color:var(--text); border-radius:8px; padding:6px 10px; font-size:11px; font-weight:700;
}
.header-actions button:hover{background:#374151;}

/* MAIN */
main{max-width:1000px; margin:auto; padding:16px 16px 90px;}

/* MONEY CARDS */
.money-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px;}
@media(max-width:768px){.money-grid{grid-template-columns:1fr;}}
.money-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; position:relative; box-shadow:var(--shadow);
}
.card-clear-btn{
  position:absolute; top:12px; right:12px; background:var(--line); border:0; border-radius:6px; padding:3px 8px; font-size:10px; font-weight:700; color:var(--muted);
}
.card-clear-btn:hover{color:white;}
.money-label{color:var(--muted); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;}
.money-value{margin-top:6px; font-size:22px; font-weight:900; letter-spacing:-0.5px;}
.money-currency{font-size:12px; margin-left:2px; font-weight:700; color:var(--muted);}
.money-count{margin-top:4px; color:var(--muted); font-size:11px;}
.text-red{color:var(--red)!important;}

/* ACTIONS & SEARCH */
.action-btn{
  width:100%; border-radius:var(--radius); padding:14px; border:0; background:var(--primary); color:white; font-weight:800; text-align:left; font-size:14px; box-shadow:var(--shadow);
}
.action-btn:hover{background:var(--primary-hover);}
.action-btn small{display:block; margin-top:2px; opacity:0.8; font-weight:500; font-size:12px;}

.search-row{display:flex; gap:8px; margin-bottom:12px;}
.search, .filter-btn{
  height:44px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:white; padding:0 14px; outline:none; font-size:13px;
}
.search{flex:1;}
.search:focus, .filter-btn:focus{border-color:var(--primary);}
.filter-btn{font-weight:700;}

.filter-panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px;}
.filter-panel select{width:100%; height:40px; border:1px solid var(--line); border-radius:10px; background:#030712; color:white; padding:0 10px; outline:none; margin-top:4px;}
.filter-options{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:10px;}
.filter-options button{border:1px solid var(--line); background:#030712; border-radius:8px; padding:8px; font-weight:700; font-size:12px; color:var(--muted);}
.filter-options button.active{background:var(--primary); color:white; border-color:var(--primary);}

/* GALLERY */
.gallery{display:none;}
.gallery.active{display:block;}
.gallery-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
@media(min-width:700px){.gallery-grid{grid-template-columns:repeat(4,1fr);}}
.folder{grid-column:1/-1; margin-top:8px;}
.folder-title{font-size:16px; font-weight:900; margin:10px 0 8px; letter-spacing:-0.3px;}
.folder-products{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
@media(min-width:700px){.folder-products{grid-template-columns:repeat(4,1fr);}}

.gallery-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; cursor:pointer; box-shadow:var(--shadow); transition:transform 0.15s;
}
.gallery-card:hover{transform:translateY(-2px); border-color:#374151;}
.gallery-card img{width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:#030712;}
.gallery-details{padding:10px;}
.gallery-name{font-size:12px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.gallery-price, .gallery-sell-price{margin-top:2px; font-size:11px; font-weight:700;}
.gallery-price{color:var(--muted);}
.gallery-sell-price{color:var(--green);}
.gallery-qty{color:var(--muted); font-size:10px; margin-top:3px;}
.gallery-stock{font-size:9px; font-weight:900; margin-top:4px; letter-spacing:0.5px;}
.gallery-stock.in{color:var(--green);}
.gallery-stock.out{color:var(--red);}

/* NAV */
.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; justify-content:center;
  background:rgba(9,13,22,0.9); backdrop-filter:blur(12px); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-btn{width:50%; max-width:260px; padding:12px; border:0; background:transparent; color:var(--muted); font-weight:800; font-size:12px;}
.nav-btn.active{color:var(--primary); border-top:2px solid var(--primary); background:rgba(59,130,246,0.05);}

/* MODAL */
.modal{position:fixed; inset:0; z-index:50; display:flex; justify-content:center; align-items:flex-end; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px);}
.modal-box{
  width:min(580px,100%); max-height:92vh; overflow:auto; background:var(--card); border:1px solid var(--line);
  border-radius:20px 20px 0 0; padding:20px 16px 30px; box-shadow:0 -20px 25px -5px rgba(0,0,0,0.3);
}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.modal-head h2{margin:0; font-size:18px; font-weight:800;}
.close{width:32px; height:32px; border:0; border-radius:8px; background:var(--line); font-size:18px; color:var(--muted); display:flex; align-items:center; justify-content:center;}
.close:hover{color:white;}

.photo-preview{width:100%; height:200px; object-fit:cover; border-radius:12px; background:#030712;}
.fields{display:grid; gap:10px; margin-top:12px;}
.field label{display:block; font-size:11px; font-weight:800; margin-bottom:4px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px;}
.field input, .field select{
  width:100%; height:44px; border:1px solid var(--line); border-radius:10px; background:#030712; color:white; padding:0 12px; outline:none; font-size:13px;
}
.field input:focus, .field select:focus{border-color:var(--primary);}

.save-row{display:flex; gap:8px; margin-top:16px;}
.primary, .secondary, .danger{flex:1; border:0; border-radius:10px; padding:12px; font-weight:800; font-size:13px;}
.primary{background:var(--primary); color:white;}
.primary:hover{background:var(--primary-hover);}
.secondary{background:var(--line); color:white;}
.secondary:hover{background:#374151;}
.danger{background:rgba(239,68,68,0.15); color:var(--red); border:1px solid rgba(239,68,68,0.3);}
.danger:hover{background:rgba(239,68,68,0.25);}

/* DETAILS MODAL EXTRAS */
.delete-top{width:100%; margin-bottom:10px; border:0; border-radius:10px; background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.3); color:var(--red); padding:12px; font-weight:900;}
.detail-photo{width:100%; max-height:300px; object-fit:contain; background:#030712; border-radius:12px; display:block; border:1px solid var(--line);}
.detail-card{background:#030712; border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:10px;}
.detail-name{font-size:18px; font-weight:900; letter-spacing:-0.3px;}
.detail-folder{color:var(--muted); margin-top:2px; font-size:12px; font-weight:600;}
.detail-row{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;}
.detail-row:last-child{border-bottom:0;}
.detail-label{color:var(--muted); font-weight:500;}

.stock-controls{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:10px;}
.stock-controls button{border:1px solid var(--line); background:#030712; color:white; border-radius:10px; padding:10px; font-weight:800; font-size:12px;}
.stock-controls button:hover{background:var(--line);}

.notif-item{padding:10px 0; border-bottom:1px solid var(--line); font-size:12px;}
.notif-item:last-child{border-bottom:0;}
.notif-date{font-size:10px; color:var(--muted); margin-top:2px;}
.empty{background:#030712; border:1px solid var(--line); border-radius:12px; padding:24px; text-align:center; color:var(--muted); font-size:13px;}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginScreen">
  <div class="login-card">
    <h1>7 Center</h1>
    <p>Enter passcode to access dashboard</p>
    <form id="loginForm">
      <input id="passcode" class="passcode" type="password" autocomplete="off" placeholder="••••">
      <button class="login-btn" type="submit">Authenticate</button>
    </form>
    <div id="loginError" class="login-error"></div>
  </div>
</section>

<!-- APP -->
<div id="app" class="hidden">
<header>
  <div class="header-inner">
    <h1>7 Center</h1>
    <div class="header-actions">
      <button onclick="changeExchangeRate()">💱 Exg</button>
      <button onclick="openNotifications()">🔔 Log</button>
      <button onclick="lockApp()">Lock</button>
    </div>
  </div>
</header>

<main>
<!-- DASHBOARD -->
<section id="dashboard" class="dashboard active">
  <div class="money-grid">
    <div class="money-card">
      <button class="card-clear-btn" onclick="clearMoneyCard('earned')">Clear</button>
      <div class="money-label">Total Earned</div>
      <div class="money-value"><span id="totalMoney">0</span><span class="money-currency">د.ع</span></div>
      <div class="money-count"><span id="soldCount">0</span> sold</div>
    </div>
    <div class="money-card">
      <button class="card-clear-btn" onclick="clearMoneyCard('added')">Clear</button>
      <div class="money-label">Stock Value</div>
      <div class="money-value"><span id="addedMoney">0</span><span class="money-currency" id="addedCurrencySymbol">$</span></div>
      <div class="money-count">Active inventory</div>
    </div>
    <div class="money-card">
      <button class="card-clear-btn" onclick="clearMoneyCard('dropped')">Clear</button>
      <div class="money-label">Value Drop</div>
      <div class="money-value text-red"><span id="droppedMoney">0</span><span class="money-currency" id="droppedCurrencySymbol">$</span></div>
      <div class="money-count">Sold/removed cost</div>
    </div>
  </div>

  <div style="margin-top:12px;">
    <button class="action-btn" onclick="scanForAdd()">
      + Add Product
      <small>Upload photo & register stock parameters</small>
    </button>
  </div>
</section>

<!-- PRODUCTS GALLERY -->
<section id="gallery" class="gallery">
  <div class="search-row">
    <input id="gallerySearch" class="search" type="search" placeholder="Search inventory..." oninput="renderGallery()">
    <button class="filter-btn" onclick="toggleFilter()">Filter</button>
  </div>

  <div id="filterPanel" class="filter-panel hidden">
    <label style="display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;">Folder</label>
    <select id="folderFilter" onchange="renderGallery()">
      <option value="">All folders</option>
    </select>
    <div class="filter-options">
      <button id="filterAll" class="active" onclick="setStockFilter('all')">All</button>
      <button id="filterIn" onclick="setStockFilter('in')">In Stock</button>
      <button id="filterOut" onclick="setStockFilter('out')">Out</button>
    </div>
  </div>

  <div id="galleryGrid" class="gallery-grid"></div>
</section>
</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button id="navInventory" class="nav-btn active" onclick="showTab('inventory')">Dashboard</button>
  <button id="navProducts" class="nav-btn" onclick="showTab('products')">Products</button>
</nav>
</div>

<input id="scanInput" type="file" accept="image/*" hidden>

<!-- PRODUCT MODAL -->
<div id="productModal" class="modal hidden" onclick="if(event.target===this) closeModal()">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modalTitle">Add Product</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <img id="productPhotoPreview" class="photo-preview hidden" alt="Preview">
    <div class="fields">
      <div class="field"><label>Name</label><input id="name" type="text" placeholder="Product name"></div>
      <div class="field"><label>Folder</label><input id="folder" type="text" list="folderList" placeholder="Category"><datalist id="folderList"></datalist></div>
      <div class="field"><label>Quantity</label><input id="quantity" type="number" min="0" value="1"></div>
      <div class="field"><label>Buy Price</label><input id="buyPrice" type="number" min="0" step="0.01" placeholder="0"></div>
      <div class="field"><label>Buy Currency</label><select id="buyCurrency"><option value="IQD">د.ع</option><option value="USD">$</option></select></div>
      <div class="field"><label>Sell Price</label><input id="sellPriceInput" type="number" min="0" step="0.01" placeholder="0"></div>
      <div class="field"><label>Sell Currency</label><select id="sellCurrencyInput"><option value="IQD">د.ع</option><option value="USD">$</option></select></div>
    </div>
    <div class="save-row">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="saveProduct()">Save</button>
    </div>
  </div>
</div>

<!-- DETAILS MODAL -->
<div id="detailModal" class="modal hidden" onclick="if(event.target===this) closeDetailModal()">
  <div class="modal-box">
    <div class="modal-head"><h2>Product Details</h2><button class="close" onclick="closeDetailModal()">×</button></div>
    <div id="detailContent"></div>
  </div>
</div>

<!-- NOTIFICATIONS MODAL -->
<div id="notifModal" class="modal hidden" onclick="if(event.target===this) closeNotifications()">
  <div class="modal-box">
    <div class="modal-head"><h2>Activity Log</h2><button class="close" onclick="closeNotifications()">×</button></div>
    <div style="margin-bottom:10px;"><button class="danger" style="width:100%;padding:8px;" onclick="clearAllNotifications()">Clear Log</button></div>
    <div id="notifList"></div>
  </div>
</div>

<script>
const PASSCODE = "165naseh";
const FIREBASE_URL = "https://store-products-6de04-default-rtdb.firebaseio.com/";

let products = [], transactions = [], editingId = null, selectedStockFilter = "all";
let totalMoney = 0, soldCount = 0, addedMoney = 0, droppedMoney = 0, stockCurrency = "$", exchangeRate = 1;

document.getElementById("loginForm").addEventListener("submit", e => {
  e.preventDefault();
  const val = document.getElementById("passcode").value;
  if(val === PASSCODE){
    sessionStorage.setItem("inventoryUnlocked", "1");
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    initFirebaseSync();
  } else {
    document.getElementById("loginError").textContent = "Incorrect passcode.";
    document.getElementById("passcode").value = "";
  }
});

function lockApp(){
  sessionStorage.removeItem("inventoryUnlocked");
  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
}

async function initFirebaseSync(){
  await loadFromFirebase();
  setInterval(loadFromFirebase, 5000);
}

async function loadFromFirebase(){
  try {
    const res = await fetch(`${FIREBASE_URL}.json`);
    const data = await res.json();
    if(data){
      products = data.products ? Object.values(data.products) : [];
      transactions = data.transactions || [];
      const m = data.money || {};
      totalMoney = Number(m.totalMoney) || 0;
      soldCount = Number(m.soldCount) || 0;
      droppedMoney = Number(m.droppedMoney) || 0;
      if(m.stockCurrency) stockCurrency = m.stockCurrency;
      if(m.exchangeRate) exchangeRate = Number(m.exchangeRate) || 1;
    }
    recalculateStockValues();
    renderGallery();
    updateFolderList();
    updateMoneyDisplay();
  } catch(e){}
}

async function saveToFirebase(){
  const productsObj = {};
  products.forEach(p => { productsObj[p.id] = p; });
  await fetch(`${FIREBASE_URL}.json`, {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ products: productsObj, transactions, money: { totalMoney, soldCount, droppedMoney, stockCurrency, exchangeRate } })
  }).catch(()=>{});
}

function logTransaction(text){
  transactions.unshift({ text, time: new Date().toLocaleString() });
  saveToFirebase();
}

function clearAllNotifications(){
  if(!confirm("Clear log?")) return;
  transactions = [];
  saveToFirebase();
  openNotifications();
}

function recalculateStockValues(){
  addedMoney = 0;
  products.forEach(p => {
    let val = (Number(p.quantity) || 0) * (Number(p.buyPrice) || 0);
    if(p.buyCurrency !== stockCurrency && exchangeRate > 1){
      if(p.buyCurrency === "IQD" && stockCurrency === "$") val /= exchangeRate;
      else if(p.buyCurrency === "USD" && stockCurrency === "د.ع") val *= exchangeRate;
    }
    addedMoney += val;
  });
  updateMoneyDisplay();
}

function makeId(){
  return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36);
}

function readImage(file){
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.readAsDataURL(file);
  });
}

function scanForAdd(){ document.getElementById("scanInput").click(); }

document.getElementById("scanInput").addEventListener("change", async function(){
  if(this.files && this.files[0]) openAddProduct(await readImage(this.files[0]));
  this.value = "";
});

function openAddProduct(photo){
  editingId = null;
  document.getElementById("modalTitle").textContent = "Add Product";
  ["name","folder","buyPrice","sellPriceInput"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("quantity").value = 1;
  const p = document.getElementById("productPhotoPreview");
  p.src = photo; p.dataset.photo = photo; p.classList.remove("hidden");
  updateFolderList();
  document.getElementById("productModal").classList.remove("hidden");
}

function editProduct(id){
  const p = products.find(x => x.id === id);
  if(!p) return;
  editingId = id;
  document.getElementById("modalTitle").textContent = "Edit Product";
  document.getElementById("name").value = p.name || "";
  document.getElementById("folder").value = p.folder || "";
  document.getElementById("quantity").value = p.quantity || 0;
  document.getElementById("buyPrice").value = p.buyPrice || 0;
  document.getElementById("buyCurrency").value = p.buyCurrency || "IQD";
  document.getElementById("sellPriceInput").value = p.sellPrice || "";
  document.getElementById("sellCurrencyInput").value = p.sellCurrency || "IQD";
  const prev = document.getElementById("productPhotoPreview");
  if(p.photo){ prev.src = p.photo; prev.dataset.photo = p.photo; prev.classList.remove("hidden"); }
  updateFolderList();
  document.getElementById("productModal").classList.remove("hidden");
}

function closeModal(){ document.getElementById("productModal").classList.add("hidden"); }

async function saveProduct(){
  const name = document.getElementById("name").value.trim();
  if(!name) return alert("Enter name.");
  const old = editingId ? products.find(p => p.id === editingId) : null;
  const product = {
    id: editingId || makeId(),
    name,
    folder: document.getElementById("folder").value.trim() || "Other",
    quantity: Math.max(0, parseInt(document.getElementById("quantity").value) || 0),
    buyPrice: Math.max(0, parseFloat(document.getElementById("buyPrice").value) || 0),
    buyCurrency: document.getElementById("buyCurrency").value,
    sellPrice: Math.max(0, parseFloat(document.getElementById("sellPriceInput").value) || 0),
    sellCurrency: document.getElementById("sellCurrencyInput").value,
    photo: document.getElementById("productPhotoPreview").dataset.photo || old?.photo || null,
    createdAt: old?.createdAt || Date.now()
  };

  const idx = products.findIndex(p => p.id === product.id);
  if(idx >= 0) products[idx] = product;
  else { products.unshift(product); logTransaction(`Added: ${name}`); }

  closeModal();
  recalculateStockValues();
  renderGallery();
  updateFolderList();
  await saveToFirebase();
}

function renderGallery(){
  const grid = document.getElementById("galleryGrid");
  const search = document.getElementById("gallerySearch").value.trim().toLowerCase();
  const folder = document.getElementById("folderFilter").value;

  const list = products.filter(p => {
    const matchesSearch = (p.name + " " + p.folder).toLowerCase().includes(search);
    const matchesFolder = !folder || p.folder === folder;
    const qty = Number(p.quantity) || 0;
    let matchesStock = true;
    if(selectedStockFilter === "in") matchesStock = qty > 0;
    if(selectedStockFilter === "out") matchesStock = qty <= 0;
    return matchesSearch && matchesFolder && matchesStock;
  });

  if(!list.length){ grid.innerHTML = `<div class="empty" style="grid-column:1/-1">No products found.</div>`; return; }

  const folders = {};
  list.forEach(p => {
    const f = p.folder || "Other";
    if(!folders[f]) folders[f] = [];
    folders[f].push(p);
  });

  grid.innerHTML = Object.keys(folders).sort().map(fName => `
    <div class="folder">
      <div class="folder-title">${escapeHTML(fName)}</div>
      <div class="folder-products">
        ${folders[fName].map(p => {
          const q = Number(p.quantity) || 0;
          return `
            <div class="gallery-card" onclick="openProduct('${p.id}')">
              ${p.photo ? `<img src="${p.photo}" alt="">` : `<div style="width:100%;aspect-ratio:1/1;background:#030712;"></div>`}
              <div class="gallery-details">
                <div class="gallery-name">${escapeHTML(p.name)}</div>
                <div class="gallery-price">Buy: ${formatPrice(p.buyPrice, p.buyCurrency)}</div>
                <div class="gallery-sell-price">Sell: ${formatPrice(p.sellPrice, p.sellCurrency)}</div>
                <div class="gallery-qty">Qty: ${q}</div>
                <div class="gallery-stock ${q > 0 ? 'in' : 'out'}">${q > 0 ? 'IN STOCK' : 'OUT'}</div>
              </div>
            </div>
          `;
        }).join("")}
      </div>
    </div>
  `).join("");
}

function updateFolderList(){
  const unique = {};
  products.forEach(p => unique[(p.folder || "Other").trim().toLowerCase()] = (p.folder || "Other").trim());
  const folders = Object.values(unique).sort();
  document.getElementById("folderList").innerHTML = folders.map(f => `<option value="${escapeHTML(f)}"></option>`).join("");
  const sel = document.getElementById("folderFilter");
  const cur = sel.value;
  sel.innerHTML = `<option value="">All folders</option>` + folders.map(f => `<option value="${escapeHTML(f)}">${escapeHTML(f)}</option>`).join("");
  if(folders.includes(cur)) sel.value = cur;
}

function toggleFilter(){ document.getElementById("filterPanel").classList.toggle("hidden"); }

function setStockFilter(val){
  selectedStockFilter = val;
  ["all","in","out"].forEach(k => document.getElementById("filter"+k.charAt(0).toUpperCase()+k.slice(1)).classList.remove("active"));
  document.getElementById("filter"+val.charAt(0).toUpperCase()+val.slice(1)).classList.add("active");
  renderGallery();
}

function openProduct(id){
  const p = products.find(x => x.id === id);
  if(!p) return;
  const q = Number(p.quantity) || 0;
  document.getElementById("detailContent").innerHTML = `
    <button class="delete-top" onclick="deleteProduct('${p.id}', true)">Delete Entire Product</button>
    ${p.photo ? `<img class="detail-photo" src="${p.photo}" alt="">` : ''}
    <div class="detail-card">
      <div class="detail-name">${escapeHTML(p.name)}</div>
      <div class="detail-folder">Folder: ${escapeHTML(p.folder || "Other")}</div>
      <div class="detail-row"><span class="detail-label">Status</span><b>${q > 0 ? "IN STOCK" : "OUT"}</b></div>
      <div class="detail-row"><span class="detail-label">Quantity</span><b>${q}</b></div>
      <div class="detail-row"><span class="detail-label">Buy Price</span><b>${formatPrice(p.buyPrice, p.buyCurrency)}</b></div>
      <div class="detail-row"><span class="detail-label">Sell Price</span><b>${formatPrice(p.sellPrice, p.sellCurrency)}</b></div>
    </div>
    <div class="stock-controls">
      <button onclick="changeStock('${p.id}', -1)">− 1</button>
      <button onclick="changeStock('${p.id}', 1)">+ 1</button>
      <button onclick="restockProduct('${p.id}')">Restock</button>
    </div>
    ${q > 0 ? `<button class="primary" style="width:100%;margin-top:10px;" onclick="sellProduct('${p.id}')">Sell Item</button>` : `<div class="empty" style="margin-top:10px">Out of stock</div>`}
    <div class="save-row" style="margin-top:10px;">
      <button class="secondary" onclick="closeDetailModal();editProduct('${p.id}')">Edit</button>
      <button class="secondary" onclick="closeDetailModal()">Close</button>
    </div>
  `;
  document.getElementById("detailModal").classList.remove("hidden");
}

function closeDetailModal(){ document.getElementById("detailModal").classList.add("hidden"); }

async function deleteProduct(id, close=false){
  if(!confirm("Delete product?")) return;
  products = products.filter(x => x.id !== id);
  logTransaction("Deleted product");
  recalculateStockValues();
  renderGallery();
  updateFolderList();
  await saveToFirebase();
  if(close) closeDetailModal();
}

async function changeStock(id, amt){
  const p = products.find(x => x.id === id);
  if(!p) return;
  p.quantity = Math.max(0, (Number(p.quantity) || 0) + amt);
  recalculateStockValues();
  renderGallery();
  openProduct(id);
  await saveToFirebase();
}

async function restockProduct(id){
  const p = products.find(x => x.id === id);
  if(!p) return;
  const val = prompt("Restock quantity:", "1");
  const n = parseInt(val, 10);
  if(!n || n <= 0) return;
  p.quantity = (Number(p.quantity) || 0) + n;
  logTransaction(`Restocked ${n}x ${p.name}`);
  recalculateStockValues();
  renderGallery();
  openProduct(id);
  await saveToFirebase();
}

async function sellProduct(id){
  const p = products.find(x => x.id === id);
  if(!p || (Number(p.quantity) || 0) <= 0) return alert("Out of stock.");
  const priceInput = prompt("Sell price:", p.sellPrice || 0);
  const amt = Number(priceInput);
  if(!amt || amt <= 0) return;

  totalMoney += amt;
  soldCount += 1;
  p.quantity = Math.max(0, Number(p.quantity) - 1);

  logTransaction(`Sold 1x ${p.name}`);
  recalculateStockValues();
  renderGallery();
  openProduct(id);
  await saveToFirebase();
}

function updateMoneyDisplay(){
  document.getElementById("totalMoney").textContent = totalMoney.toLocaleString();
  document.getElementById("soldCount").textContent = soldCount;
  document.getElementById("addedMoney").textContent = addedMoney.toLocaleString(undefined, {maximumFractionDigits:2});
  document.getElementById("droppedMoney").textContent = droppedMoney.toLocaleString(undefined, {maximumFractionDigits:2});
  document.getElementById("addedCurrencySymbol").textContent = stockCurrency;
  document.getElementById("droppedCurrencySymbol").textContent = stockCurrency;
}

function clearMoneyCard(type){
  if(!confirm("Clear counter?")) return;
  if(type === 'earned'){ totalMoney = 0; soldCount = 0; }
  else if(type === 'added'){ addedMoney = 0; }
  else if(type === 'dropped'){ droppedMoney = 0; }
  updateMoneyDisplay();
  saveToFirebase();
}

async function changeExchangeRate(){
  const r = prompt("Enter 1$ rate in IQD:", exchangeRate);
  if(!r) return;
  exchangeRate = Number(r) || 1;
  const c = prompt("Display currency ('$' or 'د.ع'):", stockCurrency);
  if(c === "$" || c === "د.ع") stockCurrency = c;
  recalculateStockValues();
  await saveToFirebase();
}

function openNotifications(){
  document.getElementById("notifList").innerHTML = transactions.length ? transactions.map(t => `
    <div class="notif-item"><div>${escapeHTML(t.text)}</div><div class="notif-date">${escapeHTML(t.time)}</div></div>
  `).join("") : `<div class="empty">No log history</div>`;
  document.getElementById("notifModal").classList.remove("hidden");
}

function closeNotifications(){ document.getElementById("notifModal").classList.add("hidden"); }

function formatPrice(val, curr){
  const n = Number(val) || 0;
  return curr === "USD" ? "$" + n.toLocaleString() : n.toLocaleString() + " د.ع";
}

function escapeHTML(str){
  return String(str || "").replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
}

function showTab(tab){
  const isInv = tab === 'inventory';
  document.getElementById("dashboard").classList.toggle("active", isInv);
  document.getElementById("gallery").classList.toggle("active", !isInv);
  document.getElementById("navInventory").classList.toggle("active", isInv);
  document.getElementById("navProducts").classList.toggle("active", !isInv);
  if(!isInv){ updateFolderList(); renderGallery(); }
}

window.addEventListener("load", () => {
  if(sessionStorage.getItem("inventoryUnlocked") === "1"){
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    initFirebaseSync();
  }
});
</script>
</body>
</html>
