<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Center Inventory</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f4f6f8;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --primary:#111827;
  --danger:#b91c1c;
  --green:#047857;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:linear-gradient(145deg,#111827,#263244);
}

.login-card{
  width:min(420px,100%);
  background:white;
  border-radius:24px;
  padding:32px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
  text-align:center;
}

.login-card h1{
  margin:0 0 8px;
  font-size:28px;
}

.login-card p{
  margin:0 0 25px;
  color:var(--muted);
}

.passcode{
  width:100%;
  height:54px;
  border:1px solid var(--line);
  border-radius:14px;
  padding:0 16px;
  text-align:center;
  font-size:20px;
  letter-spacing:3px;
  outline:none;
}

.login-btn{
  width:100%;
  height:54px;
  margin-top:14px;
  border:0;
  border-radius:14px;
  background:#111827;
  color:white;
  font-weight:700;
}

.login-error{
  height:24px;
  margin-top:12px;
  color:var(--danger);
  font-size:14px;
  font-weight:600;
}

/* HEADER */

header{
  background:#111827;
  color:white;
  padding:18px;
  position:sticky;
  top:0;
  z-index:20;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

header h1{
  font-size:20px;
  margin:0;
}

.lock-btn{
  border:1px solid rgba(255,255,255,.25);
  background:transparent;
  color:white;
  border-radius:10px;
  padding:8px 12px;
}

/* MAIN */

main{
  max-width:1100px;
  margin:auto;
  padding:18px 16px 100px;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:16px;
}

.stat{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px;
}

.stat small{
  display:block;
  color:var(--muted);
  font-size:12px;
}

.stat strong{
  display:block;
  margin-top:6px;
  font-size:19px;
}

/* ACTION BUTTONS */

.action-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}

.action-btn{
  border:0;
  border-radius:14px;
  padding:15px;
  font-weight:800;
  text-align:left;
}

.action-btn small{
  display:block;
  font-weight:500;
  margin-top:4px;
  opacity:.75;
}

.action-add{
  background:#111827;
  color:white;
}

.action-info{
  background:white;
  border:1px solid var(--line);
  color:#111827;
}

/* SEARCH */

.search{
  width:100%;
  height:46px;
  border:1px solid var(--line);
  border-radius:12px;
  padding:0 14px;
  background:white;
  margin-bottom:16px;
  outline:none;
}

/* PRODUCT LIST */

.product-list{
  display:grid;
  gap:12px;
}

.product-card{
  background:white;
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px;
  display:flex;
  gap:14px;
  align-items:center;
}

.product-card img{
  width:78px;
  height:78px;
  border-radius:12px;
  object-fit:cover;
  background:#f0f0f0;
  flex:none;
}

.product-info{
  min-width:0;
  flex:1;
}

.product-name{
  font-weight:800;
  font-size:16px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.product-model{
  font-size:13px;
  color:var(--muted);
  margin-top:3px;
}

.colors{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin-top:7px;
}

.color-chip{
  font-size:11px;
  background:#f1f5f9;
  border-radius:999px;
  padding:4px 7px;
}

.product-meta{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:8px;
  font-size:12px;
  color:var(--muted);
}

.product-meta b{
  color:var(--text);
}

.stock-badge{
  display:inline-block;
  margin-top:7px;
  padding:5px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}

.in-stock{
  background:#dcfce7;
  color:#166534;
}

.out-stock{
  background:#fee2e2;
  color:#991b1b;
}

.card-actions{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.edit-btn,
.info-btn{
  border:1px solid var(--line);
  background:white;
  border-radius:9px;
  padding:8px 10px;
  font-size:12px;
}

.delete-btn{
  border:0;
  background:#fee2e2;
  color:#991b1b;
  border-radius:9px;
  padding:8px 10px;
  font-size:12px;
}

/* GALLERY */

.gallery{
  display:none;
}

.gallery.active{
  display:block;
}

.dashboard.active{
  display:block;
}

.gallery-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.gallery-card{
  background:white;
  border:1px solid var(--line);
  border-radius:13px;
  overflow:hidden;
  cursor:pointer;
}

.gallery-card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  background:#f0f0f0;
}

.gallery-details{
  padding:8px;
}

.gallery-name{
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.gallery-price{
  font-size:13px;
  font-weight:800;
  margin-top:4px;
}

.gallery-qty{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.gallery-stock{
  font-size:11px;
  font-weight:800;
  margin-top:5px;
}

.gallery-stock.out{
  color:#b91c1c;
}

.gallery-stock.in{
  color:#047857;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:center;
  z-index:30;
  padding-bottom:env(safe-area-inset-bottom);
}

.nav-btn{
  width:50%;
  max-width:280px;
  border:0;
  background:white;
  padding:14px 8px;
  color:var(--muted);
  font-weight:700;
}

.nav-btn.active{
  color:#111827;
  border-top:2px solid #111827;
}

/* MODALS */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:50;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.modal-box{
  background:white;
  width:min(620px,100%);
  max-height:94vh;
  overflow:auto;
  border-radius:22px 22px 0 0;
  padding:20px 16px 30px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.modal-head h2{
  margin:0;
  font-size:20px;
}

.close{
  border:0;
  background:#f1f5f9;
  border-radius:10px;
  width:38px;
  height:38px;
}

.photo-preview{
  width:100%;
  height:280px;
  object-fit:cover;
  border-radius:16px;
  background:#111827;
}

.fields{
  display:grid;
  gap:12px;
  margin-top:16px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:6px;
}

.field input{
  width:100%;
  height:44px;
  border:1px solid var(--line);
  border-radius:11px;
  padding:0 12px;
  outline:none;
}

.save-row{
  display:flex;
  gap:9px;
  margin-top:18px;
}

.save-row button{
  flex:1;
}

.primary,
.secondary,
.danger{
  border:0;
  border-radius:12px;
  padding:12px 15px;
  font-weight:700;
}

.primary{
  background:#111827;
  color:white;
}

.secondary{
  background:white;
  border:1px solid var(--line);
  color:var(--text);
}

.danger{
  background:#fee2e2;
  color:#991b1b;
}

/* STOCK */

.stock-panel{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px;
  margin-top:15px;
}

.stock-status{
  font-size:18px;
  font-weight:800;
}

.stock-status.out{
  color:#b91c1c;
}

.stock-status.in{
  color:#047857;
}

.stock-controls{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.stock-controls button{
  border:1px solid var(--line);
  background:white;
  border-radius:10px;
  padding:10px;
  font-weight:700;
}

.info-result{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px;
  margin-top:14px;
}

.info-result h3{
  margin:0 0 6px;
}

.info-result p{
  margin:5px 0;
  color:var(--muted);
  font-size:14px;
}

.confirm-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:12px;
}

.note{
  font-size:11px;
  color:var(--muted);
  line-height:1.4;
  margin-top:12px;
}

/* MOBILE */

@media(max-width:650px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .product-card{
    align-items:flex-start;
  }

  .action-grid{
    grid-template-columns:1fr;
  }

}

@media(min-width:700px){

  .gallery-grid{
    grid-template-columns:repeat(4,1fr);
  }

}
</style>
</head>

<body>

<!-- LOGIN SCREEN -->

<section id="loginScreen">

  <div class="login-card">

    <h1>Center Inventory</h1>

    <p>Enter your passcode to continue</p>

    <form id="loginForm">

      <input
        id="passcode"
        class="passcode"
        type="password"
        inputmode="text"
        autocomplete="off"
        placeholder="Passcode"
      >

      <button class="login-btn" type="submit">
        Enter
      </button>

    </form>

    <div id="loginError" class="login-error"></div>

  </div>

</section>


<!-- APPLICATION -->

<div id="app" class="hidden">

<header>

  <div class="header-inner">

    <h1>Center Inventory</h1>

    <button class="lock-btn" onclick="lockApp()">
      Lock
    </button>

  </div>

</header>


<main>

<!-- INVENTORY -->

<section id="dashboard" class="dashboard active">

  <div class="stats">

    <div class="stat">
      <small>Products</small>
      <strong id="statProducts">0</strong>
    </div>

    <div class="stat">
      <small>Total units</small>
      <strong id="statUnits">0</strong>
    </div>

    <div class="stat">
      <small>Stock cost</small>
      <strong id="statCost">0</strong>
    </div>

    <div class="stat">
      <small>Potential sales</small>
      <strong id="statSales">0</strong>
    </div>

  </div>


  <div class="action-grid">

    <button
      class="action-btn action-add"
      onclick="scanForAdd()"
    >

      Add / Scan Product

      <small>
        Choose a product photo to add it to inventory
      </small>

    </button>


    <button
      class="action-btn action-info"
      onclick="scanForInfo()"
    >

      Product Information

      <small>
        Check stock, price and product information
      </small>

    </button>

  </div>


  <input
    id="searchInput"
    class="search"
    type="search"
    placeholder="Search product, model or color..."
    oninput="renderProducts()"
  >


  <div
    id="productList"
    class="product-list"
  ></div>

</section>


<!-- PRODUCTS GALLERY -->

<section id="gallery" class="gallery">

  <input
    id="gallerySearch"
    class="search"
    type="search"
    placeholder="Search products..."
    oninput="renderGallery()"
  >

  <div
    id="galleryGrid"
    class="gallery-grid"
  ></div>

</section>

</main>


<!-- NAVIGATION -->

<nav class="bottom-nav">

  <button
    id="navInventory"
    class="nav-btn active"
    onclick="showTab('inventory')"
  >
    Inventory
  </button>

  <button
    id="navProducts"
    class="nav-btn"
    onclick="showTab('products')"
  >
    Products
  </button>

</nav>

</div>


<!--
  Only one file input is needed.
  On iPhone Safari this opens the native menu:
  Photo Library
  Take Photo
  Choose File
-->

<input
  id="scanInput"
  type="file"
  accept="image/*"
  hidden
>

<input
  id="infoScanInput"
  type="file"
  accept="image/*"
  hidden
>


<!-- ADD / EDIT PRODUCT MODAL -->

<div
  id="productModal"
  class="modal hidden"
  onclick="if(event.target===this)closeModal()"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle">
        Add Product
      </h2>

      <button
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>


    <img
      id="productPhotoPreview"
      class="photo-preview hidden"
      alt="Product"
    >


    <div class="fields">

      <div class="field">

        <label>
          Product name
        </label>

        <input
          id="name"
          type="text"
          placeholder="Example: iPhone 15 Pro Max Cover"
        >

      </div>


      <div class="field">

        <label>
          Model
        </label>

        <input
          id="model"
          type="text"
          placeholder="Example: 15 Pro Max"
        >

      </div>


      <div class="field">

        <label>
          Colors
        </label>

        <input
          id="colors"
          type="text"
          placeholder="Example: Black, Blue, Red"
        >

      </div>


      <div class="field">

        <label>
          Quantity
        </label>

        <input
          id="quantity"
          type="number"
          min="0"
          step="1"
          value="1"
        >

      </div>


      <div class="field">

        <label>
          Purchase price per item
        </label>

        <input
          id="buyPrice"
          type="number"
          min="0"
          step="0.01"
          placeholder="0"
        >

      </div>


      <div class="field">

        <label>
          Selling price per item
        </label>

        <input
          id="sellPrice"
          type="number"
          min="0"
          step="0.01"
          placeholder="0"
        >

      </div>

    </div>


    <div class="save-row">

      <button
        class="secondary"
        onclick="closeModal()"
      >
        Cancel
      </button>

      <button
        class="primary"
        onclick="saveProduct()"
      >
        Save Product
      </button>

    </div>

  </div>

</div>


<!-- PRODUCT INFORMATION MODAL -->

<div
  id="infoModal"
  class="modal hidden"
  onclick="if(event.target===this)closeInfoModal()"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2>
        Product Information
      </h2>

      <button
        class="close"
        onclick="closeInfoModal()"
      >
        ×
      </button>

    </div>


    <div id="infoContent"></div>

  </div>

</div>


<script>

/* =========================================================
   SETTINGS
========================================================= */

const PASSCODE = "165naseh";

const DB_NAME = "CenterInventoryDatabase";

const DB_VERSION = 1;

const STORE_NAME = "products";


let db = null;

let products = [];

let editingId = null;

let scannedPhoto = null;


/* =========================================================
   LOGIN
========================================================= */

const loginForm =
  document.getElementById("loginForm");


loginForm.addEventListener("submit", function(e){

  e.preventDefault();

  const value =
    document.getElementById("passcode").value;


  if(value === PASSCODE){

    sessionStorage.setItem(
      "centerInventoryUnlocked",
      "1"
    );

    document
      .getElementById("loginScreen")
      .classList.add("hidden");

    document
      .getElementById("app")
      .classList.remove("hidden");

    document
      .getElementById("passcode")
      .value = "";

    document
      .getElementById("loginError")
      .textContent = "";

    initDatabase();

  }else{

    document
      .getElementById("loginError")
      .textContent =
      "Incorrect, try again.";

    document
      .getElementById("passcode")
      .value = "";

    document
      .getElementById("passcode")
      .focus();

  }

});


/* =========================================================
   LOCK
========================================================= */

function lockApp(){

  sessionStorage.removeItem(
    "centerInventoryUnlocked"
  );

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("loginScreen")
    .classList.remove("hidden");

  document
    .getElementById("passcode")
    .value = "";

  closeModal();

  closeInfoModal();

}


/* =========================================================
   INDEXED DB
========================================================= */

function initDatabase(){

  if(!window.indexedDB){

    alert(
      "This browser does not support IndexedDB."
    );

    return;

  }


  const request =
    indexedDB.open(
      DB_NAME,
      DB_VERSION
    );


  request.onupgradeneeded = function(e){

    const database =
      e.target.result;


    if(
      !database.objectStoreNames.contains(
        STORE_NAME
      )
    ){

      const store =
        database.createObjectStore(
          STORE_NAME,
          {
            keyPath:"id"
          }
        );


      store.createIndex(
        "name",
        "name",
        {
          unique:false
        }
      );


      store.createIndex(
        "model",
        "model",
        {
          unique:false
        }
      );

    }

  };


  request.onsuccess = function(e){

    db = e.target.result;

    loadProducts();

  };


  request.onerror = function(){

    alert(
      "Could not open the local database."
    );

  };

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

function loadProducts(){

  const request =
    db
      .transaction(
        STORE_NAME,
        "readonly"
      )
      .objectStore(
        STORE_NAME
      )
      .getAll();


  request.onsuccess = function(){

    products =
      request.result || [];


    products.sort(
      (a,b)=>
        (b.createdAt || 0) -
        (a.createdAt || 0)
    );


    renderProducts();

    renderGallery();

    updateStats();

  };

}


/* =========================================================
   SAVE DATABASE
========================================================= */

function putProduct(product){

  return new Promise(
    function(resolve,reject){

      const tx =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );


      tx.objectStore(
        STORE_NAME
      ).put(product);


      tx.oncomplete =
        resolve;


      tx.onerror =
        function(){

          reject(tx.error);

        };

    }
  );

}


/* =========================================================
   DELETE DATABASE ITEM
========================================================= */

function deleteFromDB(id){

  return new Promise(
    function(resolve,reject){

      const tx =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );


      tx.objectStore(
        STORE_NAME
      ).delete(id);


      tx.oncomplete =
        resolve;


      tx.onerror =
        function(){

          reject(tx.error);

        };

    }
  );

}


/* =========================================================
   ID
========================================================= */

function makeId(){

  if(
    window.crypto &&
    crypto.randomUUID
  ){

    try{

      return crypto.randomUUID();

    }catch(e){}

  }


  return (
    Date.now().toString(36) +
    "-" +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


/* =========================================================
   ADD PRODUCT SCANNER
========================================================= */

function scanForAdd(){

  /*
    This directly opens the iPhone native
    image menu.
  */

  document
    .getElementById("scanInput")
    .click();

}


/* =========================================================
   INFORMATION SCANNER
========================================================= */

function scanForInfo(){

  /*
    This directly opens the iPhone native
    image menu.
  */

  document
    .getElementById("infoScanInput")
    .click();

}


/* =========================================================
   ADD PHOTO RESULT
========================================================= */

document
  .getElementById("scanInput")
  .addEventListener(
    "change",
    async function(){

      const file =
        this.files &&
        this.files[0];


      if(!file)
        return;


      const data =
        await readImage(file);


      openAddProduct(data);


      this.value = "";

    }
  );


/* =========================================================
   INFORMATION PHOTO RESULT
========================================================= */

document
  .getElementById("infoScanInput")
  .addEventListener(
    "change",
    async function(){

      const file =
        this.files &&
        this.files[0];


      if(!file)
        return;


      const data =
        await readImage(file);


      openInfoFromScan(data);


      this.value = "";

    }
  );


/* =========================================================
   READ PHOTO
========================================================= */

function readImage(file){

  return new Promise(
    function(resolve){

      const reader =
        new FileReader();


      reader.onload =
        function(){

          resolve(
            reader.result
          );

        };


      reader.readAsDataURL(file);

    }
  );

}


/* =========================================================
   TABS
========================================================= */

function showTab(tab){

  const dashboard =
    document.getElementById(
      "dashboard"
    );

/* =========================================================
   STATISTICS
========================================================= */

function updateStats(){

  const units =
    products.reduce(
      (s,p)=>
        s +
        (Number(p.quantity) || 0),
      0
    );


  const cost =
    products.reduce(
      (s,p)=>
        s +
        (Number(p.quantity) || 0) *
        (Number(p.buyPrice) || 0),
      0
    );


  const sales =
    products.reduce(
      (s,p)=>
        s +
        (Number(p.quantity) || 0) *
        (Number(p.sellPrice) || 0),
      0
    );


  document
    .getElementById("statProducts")
    .textContent =
    products.length;


  document
    .getElementById("statUnits")
    .textContent =
    units;


  document
    .getElementById("statCost")
    .textContent =
    formatMoney(cost);


  document
    .getElementById("statSales")
    .textContent =
    formatMoney(sales);

}


function formatMoney(v){

  return Number(
    v || 0
  ).toLocaleString(
    undefined,
    {
      maximumFractionDigits:2
    }
  );

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(v){

  return String(
    v ?? ""
  ).replace(
    /[&<>"']/g,
    function(c){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[c];

    }
  );

}


/* =========================================================
   STOCK BADGE
========================================================= */

function stockText(p){

  if(Number(p.quantity) > 0){

    return `
      <span class="stock-badge in-stock">
        IN STOCK
      </span>
    `;

  }


  return `
    <span class="stock-badge out-stock">
      OUT OF STOCK
    </span>
  `;

}

/* =========================================================
   SAVE PRODUCT
========================================================= */

async function saveProduct(){

  if(!db){

    alert(
      "Database is not ready yet."
    );

    return;

  }


  const name =
    document
      .getElementById("name")
      .value
      .trim();


  if(!name){

    alert(
      "Please enter a product name."
    );

    return;

  }


  const model =
    document
      .getElementById("model")
      .value
      .trim();


  const colors =
    document
      .getElementById("colors")
      .value
      .trim();


  const quantity =
    Math.max(
      0,
      parseInt(
        document
          .getElementById("quantity")
          .value,
        10
      ) || 0
    );


  const buyPrice =
    Math.max(
      0,
      parseFloat(
        document
          .getElementById("buyPrice")
          .value
      ) || 0
    );


  const sellPrice =
    Math.max(
      0,
      parseFloat(
        document
          .getElementById("sellPrice")
          .value
      ) || 0
    );


  const old =
    editingId
    ?
    products.find(
      p=>p.id===editingId
    )
    :
    null;


  const product = {

    id:
      editingId ||
      makeId(),

    name,
    model,
    colors,
    quantity,
    buyPrice,
    sellPrice,

    photo:
      scannedPhoto ||
      (
        old
        ?
        old.photo || null
        :
        null
      ),

    createdAt:
      old
      ?
      old.createdAt
      :
      Date.now(),

    updatedAt:
      Date.now()

  };


  try{

    await putProduct(
      product
    );


    const i =
      products.findIndex(
        p=>p.id===product.id
      );


    if(i>=0){

      products[i] =
        product;

    }else{

      products.unshift(
        product
      );

    }


    renderProducts();

    renderGallery();

    updateStats();

    closeModal();

  }catch(e){

    console.error(e);

    alert(
      "Could not save this product."
    );

  }

}

/* =========================================================
   CHANGE STOCK
========================================================= */

async function changeStock(
  id,
  amount
){

  const p =
    products.find(
      x=>x.id===id
    );


  if(!p)
    return;


  p.quantity =
    Math.max(
      0,
      (
        Number(p.quantity) ||
        0
      ) + amount
    );


  p.updatedAt =
    Date.now();


  await putProduct(
    p
  );


  renderProducts();

  renderGallery();

  updateStats();

  showProductInfo(
    id
  );

}


/* =========================================================
   RESTOCK
========================================================= */

async function restockProduct(id){

  const p =
    products.find(
      x=>x.id===id
    );


  if(!p)
    return;


  const amount =
    prompt(
      "How many items do you want to bring back?",
      "1"
    );


  if(amount === null)
    return;


  const n =
    parseInt(
      amount,
      10
    );


  if(
    !Number.isFinite(n) ||
    n <= 0
  ){

    alert(
      "Enter a valid quantity."
    );

    return;

  }


  p.quantity =
    (
      Number(p.quantity) ||
      0
    ) + n;


  p.updatedAt =
    Date.now();


  await putProduct(
    p
  );


  renderProducts();

  renderGallery();

  updateStats();

  showProductInfo(
    id
  );

}


/* =========================================================
   DELETE PRODUCT
========================================================= */

async function deleteProduct(
  id,
  fromInfo=false
){

  const p =
    products.find(
      x=>x.id===id
    );


  if(!p)
    return;


  const confirmed =
    confirm(
      `Delete "${p.name || "this product"}" permanently?`
    );


  if(!confirmed)
    return;


  await deleteFromDB(
    id
  );


  products =
    products.filter(
      x=>x.id!==id
    );


  renderProducts();

  renderGallery();

  updateStats();


  if(fromInfo){

    closeInfoModal();

  }

}
