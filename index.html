<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#111827">

<title>Center Inventory</title>

<style>

*{
  box-sizing:border-box;
}

:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --primary:#111827;
  --green:#047857;
  --red:#b91c1c;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}


/* =====================================================
   LOGIN
===================================================== */

#loginScreen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px;
  background:
    linear-gradient(
      145deg,
      #111827,
      #263244
    );
}

.login-card{
  width:min(420px,100%);
  background:white;
  border-radius:24px;
  padding:32px;
  text-align:center;
  box-shadow:
    0 20px 60px rgba(0,0,0,.25);
}

.login-card h1{
  margin:0 0 8px;
  font-size:28px;
}

.login-card p{
  color:var(--muted);
  margin:0 0 24px;
}

.passcode{
  width:100%;
  height:54px;
  border:1px solid var(--line);
  border-radius:14px;
  padding:0 15px;
  text-align:center;
  font-size:20px;
  letter-spacing:3px;
  outline:none;
}

.login-btn{
  width:100%;
  height:54px;
  margin-top:14px;
  border:0;
  border-radius:14px;
  background:#111827;
  color:white;
  font-weight:800;
}

.login-error{
  height:24px;
  margin-top:12px;
  color:var(--red);
  font-weight:700;
  font-size:14px;
}


/* =====================================================
   HEADER
===================================================== */

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#111827;
  color:white;
  padding:17px;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

header h1{
  margin:0;
  font-size:20px;
}

.header-actions{
  display:flex;
  gap:6px;
  align-items:center;
}

.lock-btn,
.notif-btn,
.exg-btn{
  background:transparent;
  border:1px solid rgba(255,255,255,.3);
  color:white;
  border-radius:10px;
  padding:8px 10px;
  font-size:12px;
  font-weight:800;
}


/* =====================================================
   MAIN
===================================================== */

main{
  max-width:1100px;
  margin:auto;
  padding:18px 16px 100px;
}


/* =====================================================
   MONEY CARDS (3-GRID)
===================================================== */

.money-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:15px;
}

@media(max-width:768px){
  .money-grid{
    grid-template-columns:1fr;
  }
}

.money-card{
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  position:relative;
}

.card-clear-btn{
  position:absolute;
  top:12px;
  left:12px;
  background:#f1f5f9;
  border:0;
  border-radius:6px;
  padding:3px 8px;
  font-size:10px;
  font-weight:800;
  color:var(--muted);
}

.money-content{
  margin-top:16px;
}

.money-label{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

.money-value{
  margin-top:4px;
  font-size:24px;
  font-weight:900;
}

.money-currency{
  font-size:14px;
  margin-left:2px;
  font-weight:800;
}

.money-count{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

.text-red{
  color:var(--red)!important;
}


/* =====================================================
   ACTIONS
===================================================== */

.action-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  margin-bottom:15px;
}

.action-btn{
  width:100%;
  border-radius:14px;
  padding:16px;
  border:0;
  text-align:left;
  font-weight:800;
}

.action-btn small{
  display:block;
  margin-top:4px;
  opacity:.7;
  font-weight:500;
}

.action-add{
  background:#111827;
  color:white;
}


/* =====================================================
   SEARCH & FILTERS
===================================================== */

.search-row{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.search{
  flex:1;
  height:46px;
  border:1px solid var(--line);
  border-radius:12px;
  background:white;
  padding:0 14px;
  outline:none;
}

.filter-btn{
  height:46px;
  border:1px solid var(--line);
  background:white;
  border-radius:12px;
  padding:0 15px;
  font-weight:800;
}

.filter-panel{
  background:white;
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px;
  margin-bottom:15px;
}

.filter-panel select{
  width:100%;
  height:45px;
  border:1px solid var(--line);
  border-radius:11px;
  background:white;
  padding:0 10px;
}

.filter-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.filter-options button{
  border:1px solid var(--line);
  background:white;
  border-radius:10px;
  padding:10px;
}

.filter-options button.active{
  background:#111827;
  color:white;
}


/* =====================================================
   PRODUCTS PAGE GRID
===================================================== */

.gallery{
  display:none;
}

.gallery.active{
  display:block;
}

.gallery-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.folder{
  grid-column:1/-1;
  margin-top:7px;
}

.folder-title{
  font-size:18px;
  font-weight:900;
  margin:8px 0;
}

.folder-products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.gallery-card{
  background:white;
  border:1px solid var(--line);
  border-radius:13px;
  overflow:hidden;
  cursor:pointer;
}

.gallery-card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  background:#f1f5f9;
}

.gallery-details{
  padding:8px;
}

.gallery-name{
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.gallery-price{
  margin-top:4px;
  font-size:12px;
  font-weight:800;
}

.gallery-qty{
  color:#6b7280;
  font-size:11px;
  margin-top:3px;
}

.gallery-stock{
  font-size:10px;
  font-weight:900;
  margin-top:5px;
}

.gallery-stock.in{
  color:#047857;
}

.gallery-stock.out{
  color:#b91c1c;
}


/* =====================================================
   NAV
===================================================== */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  display:flex;
  justify-content:center;
  background:white;
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}

.nav-btn{
  width:50%;
  max-width:280px;
  padding:14px 8px;
  border:0;
  background:white;
  color:#6b7280;
  font-weight:800;
}

.nav-btn.active{
  color:#111827;
  border-top:2px solid #111827;
}


/* =====================================================
   MODAL
===================================================== */

.modal{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  background:rgba(0,0,0,.58);
}

.modal-box{
  width:min(620px,100%);
  max-height:94vh;
  overflow:auto;
  background:white;
  border-radius:22px 22px 0 0;
  padding:20px 16px 30px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.modal-head h2{
  margin:0;
  font-size:21px;
}

.close{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:#f1f5f9;
  font-size:22px;
}


/* =====================================================
   ADD PRODUCT PHOTO
===================================================== */

.photo-preview{
  width:100%;
  height:280px;
  object-fit:cover;
  border-radius:16px;
  background:#111827;
}

.fields{
  display:grid;
  gap:13px;
  margin-top:17px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin-bottom:6px;
}

.field input,
.field select{
  width:100%;
  height:45px;
  border:1px solid var(--line);
  border-radius:11px;
  background:white;
  padding:0 12px;
  outline:none;
}

.save-row{
  display:flex;
  gap:9px;
  margin-top:18px;
}

.primary,
.secondary,
.danger{
  flex:1;
  border:0;
  border-radius:12px;
  padding:13px;
  font-weight:800;
}

.primary{
  background:#111827;
  color:white;
}

.secondary{
  background:white;
  border:1px solid var(--line);
}

.danger{
  background:#fee2e2;
  color:#991b1b;
}


/* =====================================================
   PRODUCT DETAILS
===================================================== */

.delete-top{
  width:100%;
  margin-bottom:10px;
  border:0;
  border-radius:12px;
  background:#fee2e2;
  color:#991b1b;
  padding:12px;
  font-weight:900;
}

.detail-photo{
  width:100%;
  max-height:430px;
  object-fit:contain;
  background:#f1f5f9;
  border-radius:16px;
  display:block;
}

.detail-card{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px;
  margin-top:14px;
}

.detail-name{
  font-size:22px;
  font-weight:900;
}

.detail-folder{
  color:#6b7280;
  margin-top:4px;
}

.detail-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid var(--line);
}

.detail-row:last-child{
  border-bottom:0;
}

.detail-label{
  color:#6b7280;
}

.stock-controls{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.stock-controls button{
  border:1px solid var(--line);
  background:white;
  border-radius:10px;
  padding:10px;
  font-weight:800;
}

.notif-item{
  padding:10px 0;
  border-bottom:1px solid var(--line);
  font-size:13px;
}

.notif-item:last-child{
  border-bottom:0;
}

.notif-date{
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

@media(min-width:700px){
  .folder-products{
    grid-template-columns:repeat(4,1fr);
  }
}

.empty{
  background:white;
  border:1px solid var(--line);
  border-radius:15px;
  padding:25px;
  text-align:center;
  color:#6b7280;
}

</style>
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->
<section id="loginScreen">
  <div class="login-card">
    <h1>Center Inventory</h1>
    <p>Enter your passcode to continue</p>
    <form id="loginForm">
      <input id="passcode" class="passcode" type="password" autocomplete="off" placeholder="Passcode">
      <button class="login-btn" type="submit">Enter</button>
    </form>
    <div id="loginError" class="login-error"></div>
  </div>
</section>

<!-- =====================================================
     APP
===================================================== -->
<div id="app" class="hidden">

<header>
  <div class="header-inner">
    <h1>Center Inventory</h1>
    <div class="header-actions">
      <button class="exg-btn" onclick="changeExchangeRate()">💱 Exg</button>
      <button class="notif-btn" onclick="openNotifications()">🔔 Log</button>
      <button class="lock-btn" onclick="lockApp()">Lock</button>
    </div>
  </div>
</header>

<main>

<!-- =====================================================
     INVENTORY PAGE (MAIN)
===================================================== -->
<section id="dashboard" class="dashboard active">

  <!-- 3 MONEY CARDS -->
  <div class="money-grid">

    <!-- Card 1: Total Money Earned -->
    <div class="money-card">
      <button class="card-clear-btn" onclick="clearMoneyCard('earned')">Clear</button>
      <div class="money-content">
        <div class="money-label">Total Money Earned</div>
        <div class="money-value">
          <span id="totalMoney">0</span>
          <span class="money-currency">د.ع</span>
        </div>
        <div class="money-count"><span id="soldCount">0</span> items sold</div>
      </div>
    </div>

    <!-- Card 2: Total Money of Added Products -->
    <div class="money-card">
      <button class="card-clear-btn" onclick="clearMoneyCard('added')">Clear</button>
      <div class="money-content">
        <div class="money-label">Added Stock Value</div>
        <div class="money-value">
          <span id="addedMoney">0</span>
          <span class="money-currency" id="addedCurrencySymbol">$</span>
        </div>
        <div class="money-count">Active inventory value</div>
      </div>
    </div>

    <!-- Card 3: Money Went From Total Added (Red) -->
    <div class="money-card">
      <button class="card-clear-btn" onclick="clearMoneyCard('dropped')">Clear</button>
      <div class="money-content">
        <div class="money-label">Stock Value Drop</div>
        <div class="money-value text-red">
          <span id="droppedMoney">0</span>
          <span class="money-currency" id="droppedCurrencySymbol">$</span>
        </div>
        <div class="money-count">Sold/removed cost</div>
      </div>
    </div>

  </div>

  <!-- ACTIONS -->
  <div class="action-grid">
    <button class="action-btn action-add" onclick="scanForAdd()">
      Add Product
      <small>Choose a product photo</small>
    </button>
  </div>

</section>

<!-- =====================================================
     PRODUCTS PAGE
===================================================== -->
<section id="gallery" class="gallery">
  <div class="search-row">
    <input id="gallerySearch" class="search" type="search" placeholder="Search products..." oninput="renderGallery()">
    <button class="filter-btn" onclick="toggleFilter()">Filter</button>
  </div>

  <!-- FILTER -->
  <div id="filterPanel" class="filter-panel hidden">
    <label style="display:block;font-size:12px;font-weight:800;margin-bottom:6px;">Folder</label>
    <select id="folderFilter" onchange="renderGallery()">
      <option value="">All folders</option>
    </select>
    <div class="filter-options">
      <button id="filterAll" class="active" onclick="setStockFilter('all')">All</button>
      <button id="filterIn" onclick="setStockFilter('in')">In Stock</button>
      <button id="filterOut" onclick="setStockFilter('out')">Out of Stock</button>
    </div>
  </div>

  <div id="galleryGrid" class="gallery-grid"></div>
</section>

</main>

<!-- =====================================================
     BOTTOM NAV
===================================================== -->
<nav class="bottom-nav">
  <button id="navInventory" class="nav-btn active" onclick="showTab('inventory')">Inventory</button>
  <button id="navProducts" class="nav-btn" onclick="showTab('products')">Products</button>
</nav>

</div>

<!-- FILE INPUT -->
<input id="scanInput" type="file" accept="image/*" hidden>

<!-- ADD PRODUCT MODAL -->
<div id="productModal" class="modal hidden" onclick="if(event.target===this) closeModal()">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="modalTitle">Add Product</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <img id="productPhotoPreview" class="photo-preview hidden" alt="Product">
    <div class="fields">
      <div class="field">
        <label>Product name</label>
        <input id="name" type="text" placeholder="Example: iPhone 15 Pro Max Cover">
      </div>
      <div class="field">
        <label>Folder</label>
        <input id="folder" type="text" list="folderList" placeholder="Example: iPhone 15 Pro Max">
        <datalist id="folderList"></datalist>
      </div>
      <div class="field">
        <label>Quantity</label>
        <input id="quantity" type="number" min="0" step="1" value="1">
      </div>
      <div class="field">
        <label>Purchase price per item</label>
        <input id="buyPrice" type="number" min="0" step="0.01" placeholder="0">
      </div>
      <div class="field">
        <label>Purchase currency</label>
        <select id="buyCurrency">
          <option value="IQD">د.ع</option>
          <option value="USD">$</option>
        </select>
      </div>
    </div>
    <div class="save-row">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="saveProduct()">Save Product</button>
    </div>
  </div>
</div>

<!-- PRODUCT DETAILS MODAL -->
<div id="detailModal" class="modal hidden" onclick="if(event.target===this) closeDetailModal()">
  <div class="modal-box">
    <div class="modal-head">
      <h2>Product</h2>
      <button class="close" onclick="closeDetailModal()">×</button>
    </div>
    <div id="detailContent"></div>
  </div>
</div>

<!-- NOTIFICATION MODAL -->
<div id="notifModal" class="modal hidden" onclick="if(event.target===this) closeNotifications()">
  <div class="modal-box">
    <div class="modal-head">
      <h2>Transaction History</h2>
      <button class="close" onclick="closeNotifications()">×</button>
    </div>
    <div id="notifList"></div>
  </div>
</div>

<script>
const PASSCODE = "165naseh";
const FIREBASE_URL = "https://store-products-6de04-default-rtdb.firebaseio.com/";

let products = [];
let transactions = [];
let editingId = null;
let selectedStockFilter = "all";

let totalMoney = 0;
let soldCount = 0;
let addedMoney = 0;
let droppedMoney = 0;
let stockCurrency = "$"; 
let exchangeRate = 1;    

/* LOGIN */
document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  const value = document.getElementById("passcode").value;
  if(value === PASSCODE){
    sessionStorage.setItem("inventoryUnlocked", "1");
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("passcode").value = "";
    document.getElementById("loginError").textContent = "";
    initFirebaseSync();
  } else {
    document.getElementById("loginError").textContent = "Incorrect, try again.";
    document.getElementById("passcode").value = "";
    document.getElementById("passcode").focus();
  }
});

function lockApp(){
  sessionStorage.removeItem("inventoryUnlocked");
  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
  closeModal();
  closeDetailModal();
}

/* FIREBASE SYNC */
async function initFirebaseSync(){
  await loadFromFirebase();
  setInterval(loadFromFirebase, 5000);
}

async function loadFromFirebase(){
  try {
    const res = await fetch(`${FIREBASE_URL}.json`);
    const data = await res.json();
    if(data){
      products = data.products ? Object.values(data.products) : [];
      transactions = data.transactions || [];
      const moneyData = data.money || {};
      totalMoney = Number(moneyData.totalMoney) || 0;
      soldCount = Number(moneyData.soldCount) || 0;
      droppedMoney = Number(moneyData.droppedMoney) || 0;
      if(moneyData.stockCurrency) stockCurrency = moneyData.stockCurrency;
      if(moneyData.exchangeRate) exchangeRate = Number(moneyData.exchangeRate) || 1;
    }
    recalculateStockValues();
    renderGallery();
    updateFolderList();
    updateMoneyDisplay();
  } catch(err){
    console.error("Sync error:", err);
  }
}

async function saveToFirebase(){
  const productsObj = {};
  products.forEach(p => { productsObj[p.id] = p; });

  const payload = {
    products: productsObj,
    transactions: transactions,
    money: {
      totalMoney,
      soldCount,
      droppedMoney,
      stockCurrency,
      exchangeRate
    }
  };

  try {
    await fetch(`${FIREBASE_URL}.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  } catch(err){
    console.error("Cloud save error:", err);
  }
}

function logTransaction(text){
  transactions.unshift({ text, time: new Date().toLocaleString() });
  saveToFirebase();
}

function recalculateStockValues(){
  addedMoney = 0;
  products.forEach(p=>{
    const qty = Number(p.quantity) || 0;
    const price = Number(p.buyPrice) || 0;
    let val = qty * price;
    
    if(p.buyCurrency !== stockCurrency && exchangeRate > 1){
      if(p.buyCurrency === "IQD" && stockCurrency === "$"){
        val = val / exchangeRate;
      } else if(p.buyCurrency === "USD" && stockCurrency === "د.ع"){
        val = val * exchangeRate;
      }
    }
    addedMoney += val;
  });
  updateMoneyDisplay();
}

function makeId(){
  if(crypto && crypto.randomUUID){
    try{ return crypto.randomUUID(); }catch(e){}
  }
  return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
}

function readImage(file){
  return new Promise(resolve=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.readAsDataURL(file);
  });
}

function scanForAdd(){
  document.getElementById("scanInput").click();
}

document.getElementById("scanInput").addEventListener("change", async function(){
  const file = this.files && this.files[0];
  if(!file) return;
  const image = await readImage(file);
  openAddProduct(image);
  this.value = "";
});

function openAddProduct(photo){
  editingId = null;
  document.getElementById("modalTitle").textContent = "Add Product";
  document.getElementById("name").value = "";
  document.getElementById("folder").value = "";
  document.getElementById("quantity").value = 1;
  document.getElementById("buyPrice").value = "";
  document.getElementById("buyCurrency").value = "IQD";
  const preview = document.getElementById("productPhotoPreview");
  preview.src = photo;
  preview.classList.remove("hidden");
  preview.dataset.photo = photo;
  updateFolderList();
  document.getElementById("productModal").classList.remove("hidden");
}

function editProduct(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  editingId = id;
  document.getElementById("modalTitle").textContent = "Edit Product";
  document.getElementById("name").value = p.name || "";
  document.getElementById("folder").value = p.folder || "";
  document.getElementById("quantity").value = Number(p.quantity) || 0;
  document.getElementById("buyPrice").value = Number(p.buyPrice) || 0;
  document.getElementById("buyCurrency").value = p.buyCurrency || "IQD";
  const preview = document.getElementById("productPhotoPreview");
  if(p.photo){
    preview.src = p.photo;
    preview.dataset.photo = p.photo;
    preview.classList.remove("hidden");
  }
  updateFolderList();
  document.getElementById("productModal").classList.remove("hidden");
}

function closeModal(){
  document.getElementById("productModal").classList.add("hidden");
  editingId = null;
}

async function saveProduct(){
  const name = document.getElementById("name").value.trim();
  if(!name){ alert("Please enter a product name."); return; }
  const folder = document.getElementById("folder").value.trim() || "Other";
  const quantity = Math.max(0, parseInt(document.getElementById("quantity").value, 10) || 0);
  const buyPrice = Math.max(0, parseFloat(document.getElementById("buyPrice").value) || 0);
  const buyCurrency = document.getElementById("buyCurrency").value;
  const preview = document.getElementById("productPhotoPreview");
  const old = editingId ? products.find(p=>p.id===editingId) : null;

  const product = {
    id: editingId || makeId(),
    name, folder, quantity, buyPrice, buyCurrency,
    photo: preview.dataset.photo || old?.photo || null,
    createdAt: old?.createdAt || Date.now(),
    updatedAt: Date.now()
  };

  try{
    const index = products.findIndex(p=>p.id===product.id);
    if(index >= 0){
      products[index] = product;
    } else {
      products.unshift(product);
      logTransaction(`Added product: ${name} (Qty: ${quantity})`);
    }

    closeModal();
    recalculateStockValues();
    renderGallery();
    updateFolderList();
    await saveToFirebase();
  }catch(error){
    console.error(error);
    alert("Could not save the product.");
  }
}

/* FOLDERS / GALLERY */
function renderGallery(){
  const grid = document.getElementById("galleryGrid");
  const search = document.getElementById("gallerySearch").value.trim().toLowerCase();
  const folder = document.getElementById("folderFilter").value;

  let list = products.filter(p=>{
    const matchesSearch = (p.name + " " + p.folder).toLowerCase().includes(search);
    const matchesFolder = !folder || p.folder === folder;
    let matchesStock = true;
    if(selectedStockFilter === "in") matchesStock = Number(p.quantity) > 0;
    if(selectedStockFilter === "out") matchesStock = Number(p.quantity) <= 0;
    return matchesSearch && matchesFolder && matchesStock;
  });

  if(!list.length){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">No products found.</div>`;
    return;
  }

  const folders = {};
  list.forEach(p=>{
    const key = p.folder || "Other";
    if(!folders[key]) folders[key] = [];
    folders[key].push(p);
  });

  grid.innerHTML = Object.keys(folders).sort().map(folderName=>{
    return `
      <div class="folder">
        <div class="folder-title">${escapeHTML(folderName)}</div>
        <div class="folder-products">
          ${folders[folderName].map(p=>{
            const quantity = Number(p.quantity) || 0;
            return `
              <div class="gallery-card" onclick="openProduct('${p.id}')">
                ${p.photo ? `<img src="${p.photo}" alt="">` : `<div style="width:100%;aspect-ratio:1/1;background:#f1f5f9;"></div>`}
                <div class="gallery-details">
                  <div class="gallery-name">${escapeHTML(p.name)}</div>
                  <div class="gallery-price">Buy: ${formatPrice(p.buyPrice, p.buyCurrency)}</div>
                  <div class="gallery-qty">Qty: ${quantity}</div>
                  <div class="gallery-stock ${quantity > 0 ? 'in' : 'out'}">${quantity > 0 ? 'IN STOCK' : 'OUT OF STOCK'}</div>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      </div>
    `;
  }).join("");
}

function updateFolderList(){
  const datalist = document.getElementById("folderList");
  const select = document.getElementById("folderFilter");
  const unique = {};
  products.forEach(p=>{
    const folder = (p.folder || "Other").trim();
    const normalized = folder.toLowerCase();
    if(!unique[normalized]) unique[normalized] = folder;
  });
  const folders = Object.values(unique).sort((a,b)=>a.localeCompare(b));
  datalist.innerHTML = folders.map(f=>`<option value="${escapeHTML(f)}"></option>`).join("");
  const current = select.value;
  select.innerHTML = `<option value="">All folders</option>`;
  folders.forEach(f=>{
    const option = document.createElement("option");
    option.value = f;
    option.textContent = f;
    select.appendChild(option);
  });
  if(folders.includes(current)) select.value = current;
}

function toggleFilter(){
  document.getElementById("filterPanel").classList.toggle("hidden");
}

function setStockFilter(value){
  selectedStockFilter = value;
  document.getElementById("filterAll").classList.remove("active");
  document.getElementById("filterIn").classList.remove("active");
  document.getElementById("filterOut").classList.remove("active");
  if(value === "all") document.getElementById("filterAll").classList.add("active");
  if(value === "in") document.getElementById("filterIn").classList.add("active");
  if(value === "out") document.getElementById("filterOut").classList.add("active");
  renderGallery();
}

function openProduct(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  renderProductDetails(p);
  document.getElementById("detailModal").classList.remove("hidden");
}

function renderProductDetails(p){
  const quantity = Number(p.quantity) || 0;
  document.getElementById("detailContent").innerHTML = `
    <button class="delete-top" onclick="deleteProduct('${p.id}', true)">Delete Entire Product</button>
    ${p.photo ? `<img class="detail-photo" src="${p.photo}" alt="">` : ''}
    <div class="detail-card">
      <div class="detail-name">${escapeHTML(p.name)}</div>
      <div class="detail-folder">Folder: ${escapeHTML(p.folder || "Other")}</div>
      <div class="detail-row"><span class="detail-label">Stock</span><b>${quantity > 0 ? "IN STOCK" : "OUT OF STOCK"}</b></div>
      <div class="detail-row"><span class="detail-label">Quantity</span><b>${quantity}</b></div>
      <div class="detail-row"><span class="detail-label">Purchase price</span><b>${formatPrice(p.buyPrice, p.buyCurrency)}</b></div>
    </div>
    <div class="stock-controls">
      <button onclick="changeStock('${p.id}', -1)">− 1</button>
      <button onclick="changeStock('${p.id}', 1)">+ 1</button>
      <button onclick="restockProduct('${p.id}')">Restock</button>
    </div>
    ${quantity > 0 ? `<button class="primary" style="width:100%;margin-top:12px;" onclick="sellProduct('${p.id}')">Sell Item</button>` : `<div class="empty" style="margin-top:12px">This product is out of stock.</div>`}
    <div class="save-row">
      <button class="secondary" onclick="closeDetailModal(); editProduct('${p.id}');">Edit Product</button>
      <button class="secondary" onclick="closeDetailModal()">Close</button>
    </div>
  `;
}

function closeDetailModal(){
  document.getElementById("detailModal").classList.add("hidden");
}

async function deleteProduct(id, closeAfter=false){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  if(!confirm("Are you sure you want to delete this product entirely?")) return;

  let unitVal = Number(p.buyPrice) || 0;
  if(p.buyCurrency !== stockCurrency && exchangeRate > 1){
    if(p.buyCurrency === "IQD" && stockCurrency === "$") unitVal /= exchangeRate;
    else if(p.buyCurrency === "USD" && stockCurrency === "د.ع") unitVal *= exchangeRate;
  }
  addedMoney = Math.max(0, addedMoney - (unitVal * (Number(p.quantity)||0)));

  products = products.filter(x=>x.id!==id);
  logTransaction(`Deleted product: ${p.name}`);

  renderGallery();
  updateFolderList();
  recalculateStockValues();
  await saveToFirebase();
  if(closeAfter) closeDetailModal();
}

async function changeStock(id, amount){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  const oldQty = Number(p.quantity) || 0;
  const newQty = Math.max(0, oldQty + amount);
  const diff = newQty - oldQty;

  p.quantity = newQty;
  p.updatedAt = Date.now();

  let unitVal = Number(p.buyPrice) || 0;
  if(p.buyCurrency !== stockCurrency && exchangeRate > 1){
    if(p.buyCurrency === "IQD" && stockCurrency === "$") unitVal /= exchangeRate;
    else if(p.buyCurrency === "USD" && stockCurrency === "د.ع") unitVal *= exchangeRate;
  }

  if(diff < 0){
    droppedMoney += Math.abs(diff) * unitVal;
    logTransaction(`Removed ${Math.abs(diff)}x from ${p.name}`);
  } else if(diff > 0){
    logTransaction(`Added ${diff}x to ${p.name}`);
  }

  recalculateStockValues();
  renderGallery();
  renderProductDetails(p);
  await saveToFirebase();
}

async function restockProduct(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  const amount = prompt("How many items do you want to restock?", "1");
  if(amount === null) return;
  const n = parseInt(amount, 10);
  if(!Number.isFinite(n) || n <= 0){ alert("Enter a valid quantity."); return; }

  p.quantity = (Number(p.quantity) || 0) + n;
  p.updatedAt = Date.now();

  logTransaction(`Restocked ${n}x for ${p.name}`);
  recalculateStockValues();
  renderGallery();
  renderProductDetails(p);
  await saveToFirebase();
}

async function sellProduct(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  const quantity = Number(p.quantity) || 0;
  if(quantity <= 0){ alert("This product is out of stock."); return; }

  const price = prompt("How much money did you sell this item for?\nEnter the amount in د.ع", "");
  if(price === null) return;
  const amount = Number(String(price).replace(/,/g,"").trim());
  if(!Number.isFinite(amount) || amount <= 0){ alert("Please enter a valid amount in د.ع."); return; }

  totalMoney += amount;
  soldCount += 1;

  let unitVal = Number(p.buyPrice) || 0;
  if(p.buyCurrency !== stockCurrency && exchangeRate > 1){
    if(p.buyCurrency === "IQD" && stockCurrency === "$") unitVal /= exchangeRate;
    else if(p.buyCurrency === "USD" && stockCurrency === "د.ع") unitVal *= exchangeRate;
  }
  droppedMoney += unitVal;

  p.quantity = Math.max(0, quantity - 1);
  p.updatedAt = Date.now();

  logTransaction(`Sold 1x ${p.name} for ${amount.toLocaleString()} د.ع`);
  recalculateStockValues();
  renderGallery();

  if(!document.getElementById("detailModal").classList.contains("hidden")){
    renderProductDetails(p);
  }
  await saveToFirebase();
  alert("Sale recorded successfully.");
}

function updateMoneyDisplay(){
  document.getElementById("totalMoney").textContent = Number(totalMoney).toLocaleString("en-US");
  document.getElementById("soldCount").textContent = soldCount;
  document.getElementById("addedMoney").textContent = Number(addedMoney).toLocaleString("en-US", {maximumFractionDigits:2});
  document.getElementById("droppedMoney").textContent = Number(droppedMoney).toLocaleString("en-US", {maximumFractionDigits:2});
  
  document.getElementById("addedCurrencySymbol").textContent = stockCurrency;
  document.getElementById("droppedCurrencySymbol").textContent = stockCurrency;
}

function clearMoneyCard(type){
  if(!confirm("Are you sure you want to clear this counter?")) return;
  if(type === 'earned'){ totalMoney = 0; soldCount = 0; }
  else if(type === 'added'){ addedMoney = 0; }
  else if(type === 'dropped'){ droppedMoney = 0; }
  updateMoneyDisplay();
  saveToFirebase();
}

async function changeExchangeRate(){
  const rateInput = prompt("How much money is 1$ in IQD? (Enter rate, e.g. 1500):", exchangeRate > 1 ? exchangeRate : 1500);
  if(rateInput === null) return;
  const rate = Number(rateInput);

  if(!Number.isFinite(rate) || rate <= 0){
    alert("Invalid rate.");
    return;
  }

  const currChoice = prompt("Choose display currency for stock cards ('$' or 'د.ع'):", stockCurrency);
  if(!currChoice) return;
  const newCurrency = currChoice.trim();
  if(newCurrency !== "$" && newCurrency !== "د.ع"){
    alert("Please enter either '$' or 'د.ع'");
    return;
  }

  exchangeRate = rate;
  stockCurrency = newCurrency;

  recalculateStockValues();
  await saveToFirebase();
  alert("Exchange rate updated successfully!");
}

function openNotifications(){
  const list = document.getElementById("notifList");
  if(!transactions.length){
    list.innerHTML = `<div class="empty">No transactions recorded yet.</div>`;
  } else {
    list.innerHTML = transactions.map(t=> `
      <div class="notif-item">
        <div>${escapeHTML(t.text)}</div>
        <div class="notif-date">${escapeHTML(t.time)}</div>
      </div>
    `).join("");
  }
  document.getElementById("notifModal").classList.remove("hidden");
}

function closeNotifications(){
  document.getElementById("notifModal").classList.add("hidden");
}

function formatPrice(value, currency){
  const number = Number(value) || 0;
  if(currency === "USD"){
    return "$" + number.toLocaleString("en-US", {maximumFractionDigits:2});
  }
  return number.toLocaleString("en-US", {maximumFractionDigits:0}) + " د.ع";
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];
  });
}

function showTab(tab){
  const dashboard = document.getElementById("dashboard");
  const gallery = document.getElementById("gallery");
  const navInventory = document.getElementById("navInventory");
  const navProducts = document.getElementById("navProducts");

  if(tab === "inventory"){
    dashboard.classList.add("active");
    gallery.classList.remove("active");
    navInventory.classList.add("active");
    navProducts.classList.remove("active");
  } else {
    dashboard.classList.remove("active");
    gallery.classList.add("active");
    navInventory.classList.remove("active");
    navProducts.classList.add("active");
    updateFolderList();
    renderGallery();
  }
}

window.addEventListener("load", function(){
  if(sessionStorage.getItem("inventoryUnlocked") === "1"){
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    initFirebaseSync();
  } else {
    document.getElementById("passcode").focus();
  }
});
</script>
