<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#111827">

<title>Center Products</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f4f6f8;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --primary:#111827;
  --green:#047857;
  --red:#b91c1c;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#111827;
  color:white;
  padding:14px;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

header h1{
  margin:0;
  font-size:19px;
}

.header-actions{
  display:flex;
  gap:6px;
}

.header-btn{
  background:transparent;
  border:1px solid rgba(255,255,255,.3);
  color:white;
  border-radius:9px;
  padding:7px 9px;
  font-size:11px;
  font-weight:800;
}

/* MAIN */

main{
  max-width:1100px;
  margin:auto;
  padding:18px 16px 90px;
}

/* VISITOR */

.visitor-title{
  margin-bottom:15px;
}

.visitor-title h2{
  margin:0;
  font-size:23px;
}

.visitor-title p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
}

/* SEARCH */

.search-row{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.search{
  flex:1;
  height:46px;
  border:1px solid var(--line);
  border-radius:12px;
  background:white;
  padding:0 14px;
  outline:none;
}

.filter-btn{
  height:46px;
  border:1px solid var(--line);
  background:white;
  border-radius:12px;
  padding:0 15px;
  font-weight:800;
}

.filter-panel{
  background:white;
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px;
  margin-bottom:15px;
}

.filter-title{
  font-size:12px;
  font-weight:900;
  margin-bottom:8px;
}

.filter-options{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.filter-options.category-options{
  grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
}

.filter-options button{
  border:1px solid var(--line);
  background:white;
  border-radius:10px;
  padding:10px;
  font-weight:700;
}

.filter-options button.active{
  background:#111827;
  color:white;
}

/* PRODUCT GRID */

.product-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

@media(min-width:700px){
  .product-grid{
    grid-template-columns:repeat(4,1fr);
  }
}

.product-card{
  background:white;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
}

.product-card img,
.product-no-photo{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  background:#f1f5f9;
}

.product-info{
  padding:10px;
}

.product-name{
  font-size:13px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.product-model{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.product-category{
  color:#374151;
  font-size:10px;
  margin-top:4px;
  font-weight:700;
}

.product-price{
  margin-top:7px;
  font-size:14px;
  font-weight:900;
}

.product-stock{
  margin-top:5px;
  font-size:10px;
  font-weight:900;
}

.in{color:var(--green)}
.out{color:var(--red)}

.empty{
  background:white;
  border:1px solid var(--line);
  border-radius:15px;
  padding:25px;
  text-align:center;
  color:var(--muted);
  grid-column:1/-1;
}

/* ADMIN DASHBOARD */

.admin-panel{
  margin-bottom:20px;
}

.money-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:15px;
}

@media(max-width:768px){
  .money-grid{
    grid-template-columns:1fr;
  }
}

.money-card{
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  position:relative;
}

.card-clear-btn{
  position:absolute;
  top:12px;
  left:12px;
  background:#f1f5f9;
  border:0;
  border-radius:6px;
  padding:3px 8px;
  font-size:10px;
  font-weight:800;
  color:var(--muted);
}

.money-content{
  margin-top:16px;
}

.money-label{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

.money-value{
  margin-top:4px;
  font-size:24px;
  font-weight:900;
  display:flex;
  align-items:baseline;
  gap:5px;
  white-space:nowrap;
}

.money-currency{
  font-size:17px;
  font-weight:900;
}

.money-count{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

.text-red{color:var(--red)}

.action-grid{
  display:grid;
  gap:10px;
  margin-bottom:15px;
}

.action-btn{
  width:100%;
  border-radius:14px;
  padding:16px;
  border:0;
  text-align:left;
  font-weight:800;
}

.action-btn small{
  display:block;
  margin-top:4px;
  opacity:.7;
  font-weight:500;
}

.action-add{
  background:#111827;
  color:white;
}

/* NAV */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  display:flex;
  justify-content:center;
  background:white;
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}

.nav-btn{
  width:50%;
  max-width:280px;
  padding:14px 8px;
  border:0;
  background:white;
  color:#6b7280;
  font-weight:800;
}

.nav-btn.active{
  color:#111827;
  border-top:2px solid #111827;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  background:rgba(0,0,0,.58);
}

.modal-box{
  width:min(620px,100%);
  max-height:94vh;
  overflow:auto;
  background:white;
  border-radius:22px 22px 0 0;
  padding:20px 16px 30px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.modal-head h2{
  margin:0;
  font-size:21px;
}

.close{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:#f1f5f9;
  font-size:22px;
}

/* LOGIN */

.login-box{
  width:min(400px,100%);
  margin:auto;
  padding:25px;
}

.login-box input{
  width:100%;
  height:48px;
  border:1px solid var(--line);
  border-radius:11px;
  padding:0 12px;
  text-align:center;
  letter-spacing:2px;
}

.primary{
  background:#111827;
  color:white;
  border:0;
  border-radius:12px;
  padding:13px;
  font-weight:800;
}

.secondary{
  background:white;
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  font-weight:800;
}

.danger{
  background:#fee2e2;
  color:#991b1b;
  border:0;
  border-radius:12px;
  padding:13px;
  font-weight:800;
}

/* FORM */

.photo-preview{
  width:100%;
  height:280px;
  object-fit:cover;
  border-radius:16px;
  background:#111827;
}

.fields{
  display:grid;
  gap:13px;
  margin-top:17px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin-bottom:6px;
}

.field input,
.field select{
  width:100%;
  height:45px;
  border:1px solid var(--line);
  border-radius:11px;
  background:white;
  padding:0 12px;
  outline:none;
}

.save-row{
  display:flex;
  gap:9px;
  margin-top:18px;
}

.save-row button{flex:1}

/* DETAILS */

.detail-photo{
  width:100%;
  max-height:430px;
  object-fit:contain;
  background:#f1f5f9;
  border-radius:16px;
  display:block;
}

.detail-card{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px;
  margin-top:14px;
}

.detail-name{
  font-size:22px;
  font-weight:900;
}

.detail-model{
  color:var(--muted);
  margin-top:4px;
}

.detail-category{
  color:#374151;
  font-size:12px;
  font-weight:800;
  margin-top:5px;
}

.detail-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid var(--line);
}

.detail-row:last-child{
  border-bottom:0;
}

.detail-label{
  color:#6b7280;
}

.stock-controls{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.stock-controls button{
  border:1px solid var(--line);
  background:white;
  border-radius:10px;
  padding:10px;
  font-weight:800;
}

.notif-item{
  padding:10px 0;
  border-bottom:1px solid var(--line);
  font-size:13px;
}

.notif-date{
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

.notification-actions{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.notification-actions button{
  flex:1;
}
</style>
</head>

<body>

<header>

  <div class="header-inner">

    <h1>Center Products</h1>

    <div class="header-actions">

      <button
        class="header-btn"
        id="adminLoginBtn"
        onclick="openAdminLogin()">
        🔐 Admin
      </button>

      <button
        class="header-btn hidden"
        id="notifBtn"
        onclick="openNotifications()">
        🔔 Log
      </button>

      <button
        class="header-btn hidden"
        id="lockBtn"
        onclick="logoutAdmin()">
        Lock
      </button>

    </div>

  </div>

</header>


<main>

<!-- VISITOR PRODUCTS -->

<section id="visitorSection">

  <div class="visitor-title">

    <h2>Available Products</h2>

    <p>
      Browse our products and check prices.
    </p>

  </div>


  <div class="search-row">

    <input
      id="gallerySearch"
      class="search"
      type="search"
      placeholder="Search product name or model..."
      oninput="renderGallery()"
    >

    <button
      class="filter-btn"
      onclick="toggleFilter()">
      Filter
    </button>

  </div>


  <div
    id="filterPanel"
    class="filter-panel hidden">

    <div class="filter-title">
      Stock
    </div>

    <div class="filter-options">

      <button
        id="filterAll"
        class="active"
        onclick="setStockFilter('all')">
        All
      </button>

      <button
        id="filterIn"
        onclick="setStockFilter('in')">
        In Stock
      </button>

      <button
        id="filterOut"
        onclick="setStockFilter('out')">
        Out of Stock
      </button>

    </div>


    <div class="filter-title">
      Category
    </div>

    <div
      id="categoryFilters"
      class="filter-options category-options">
    </div>

  </div>


  <div
    id="galleryGrid"
    class="product-grid">
  </div>

</section>


<!-- ADMIN DASHBOARD -->

<section
  id="adminSection"
  class="admin-panel hidden">

  <div class="money-grid">

    <div class="money-card">

      <button
        class="card-clear-btn"
        onclick="clearMoneyCard('earned')">
        Clear
      </button>

      <div class="money-content">

        <div class="money-label">
          Total Money Earned
        </div>

        <div class="money-value">

          <span id="totalMoney">
            0
          </span>

          <span class="money-currency">
            د.ع
          </span>

        </div>

        <div class="money-count">

          <span id="soldCount">
            0
          </span>

          items sold

        </div>

      </div>

    </div>


    <div class="money-card">

      <button
        class="card-clear-btn"
        onclick="clearMoneyCard('added')">
        Clear
      </button>

      <div class="money-content">

        <div class="money-label">
          Added Stock Value
        </div>

        <div class="money-value">

          <span id="addedMoney">
            0
          </span>

          <span
            id="addedCurrencySymbol"
            class="money-currency">
            د.ع
          </span>

        </div>

        <div class="money-count">
          Active inventory value
        </div>

      </div>

    </div>


    <div class="money-card">

      <button
        class="card-clear-btn"
        onclick="clearMoneyCard('dropped')">
        Clear
      </button>

      <div class="money-content">

        <div class="money-label">
          Stock Value Drop
        </div>

        <div class="money-value text-red">

          <span id="droppedMoney">
            0
          </span>

          <span
            id="droppedCurrencySymbol"
            class="money-currency">
            د.ع
          </span>

        </div>

        <div class="money-count">
          Sold / removed cost
        </div>

      </div>

    </div>

  </div>


  <div class="action-grid">

    <button
      class="action-btn action-add"
      onclick="scanForAdd()">

      Add Product

      <small>
        Add photo, name, category, optional model,
        quantity, purchase price and selling price
      </small>

    </button>

  </div>

</section>

</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <button
    id="navProducts"
    class="nav-btn active"
    onclick="showTab('products')">
    Products
  </button>

  <button
    id="navInventory"
    class="nav-btn hidden"
    onclick="showTab('inventory')">
    Inventory
  </button>

</nav>


<!-- FILE INPUT -->

<input
  id="scanInput"
  type="file"
  accept="image/*"
  hidden
>


<!-- ADMIN LOGIN -->

<div
  id="adminLoginModal"
  class="modal hidden"
  onclick="if(event.target===this) closeAdminLogin()">

  <div class="modal-box">

    <div class="modal-head">

      <h2>
        Admin Login
      </h2>

      <button
        class="close"
        onclick="closeAdminLogin()">
        ×
      </button>

    </div>

    <div class="login-box">

      <input
        id="adminPasscode"
        type="password"
        autocomplete="off"
        placeholder="Admin password"
      >

      <button
        class="primary"
        style="width:100%;margin-top:12px"
        onclick="adminLogin()">
        Login
      </button>

      <div
        id="adminLoginError"
        style="color:#b91c1c;text-align:center;margin-top:10px;font-size:13px;font-weight:700">
      </div>

    </div>

  </div>

</div>


<!-- ADD / EDIT PRODUCT -->

<div
  id="productModal"
  class="modal hidden"
  onclick="if(event.target===this) closeModal()">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle">
        Add Product
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>


    <img
      id="productPhotoPreview"
      class="photo-preview hidden"
      alt="Product"
    >


    <div class="fields">

      <div class="field">

        <label>
          Item name
        </label>

        <input
          id="name"
          type="text"
          placeholder="Example: iPhone 15 Pro Max Cover"
        >

      </div>


      <!-- CATEGORY -->

      <div class="field">

        <label>
          Category
        </label>

        <input
          id="category"
          type="text"
          list="categoryList"
          placeholder="Example: Phone Accessories"
        >

        <datalist id="categoryList"></datalist>

      </div>


      <!-- MODEL IS OPTIONAL -->

      <div class="field">

        <label>
          Model <span style="color:#9ca3af">(optional)</span>
        </label>

        <input
          id="model"
          type="text"
          placeholder="Example: 15 Pro Max"
        >

      </div>


      <div class="field">

        <label>
          Quantity
        </label>

        <input
          id="quantity"
          type="number"
          min="0"
          step="1"
          value="1"
        >

      </div>


      <div class="field">

        <label>
          Purchase price per item
        </label>

        <input
          id="buyPrice"
          type="number"
          min="0"
          step="0.01"
          placeholder="0"
        >

      </div>


      <div class="field">

        <label>
          Purchase currency
        </label>

        <select id="buyCurrency">

          <option value="IQD">
            د.ع
          </option>

          <option value="USD">
            $
          </option>

        </select>

      </div>


      <div class="field">

        <label>
          Selling price per item
        </label>

        <input
          id="sellPrice"
          type="number"
          min="0"
          step="0.01"
          placeholder="Example: 25000"
        >

      </div>


      <div class="field">

        <label>
          Selling currency
        </label>

        <select id="sellCurrency">

          <option value="IQD">
            د.ع
          </option>

          <option value="USD">
            $
          </option>

        </select>

      </div>

    </div>


    <div class="save-row">

      <button
        class="secondary"
        onclick="closeModal()">
        Cancel
      </button>

      <button
        id="saveProductBtn"
        class="primary"
        onclick="saveProduct()">
        Save Product
      </button>

    </div>

  </div>

</div>


<!-- PRODUCT DETAILS -->

<div
  id="detailModal"
  class="modal hidden"
  onclick="if(event.target===this) closeDetailModal()">

  <div class="modal-box">

    <div class="modal-head">

      <h2>
        Product
      </h2>

      <button
        class="close"
        onclick="closeDetailModal()">
        ×
      </button>

    </div>

    <div id="detailContent"></div>

  </div>

</div>


<!-- NOTIFICATIONS -->

<div
  id="notifModal"
  class="modal hidden"
  onclick="if(event.target===this) closeNotifications()">

  <div class="modal-box">

    <div class="modal-head">

      <h2>
        Transaction History
      </h2>

      <button
        class="close"
        onclick="closeNotifications()">
        ×
      </button>

    </div>


    <div class="notification-actions">

      <button
        class="danger"
        onclick="clearNotifications()">
        Clear Notifications
      </button>

      <button
        class="secondary"
        onclick="closeNotifications()">
        Close
      </button>

    </div>


    <div id="notifList"></div>

  </div>

</div>


<script>

/* =====================================================
   SETTINGS
===================================================== */

const PASSCODE = "165naseh";

const FIREBASE_URL =
"https://store-products-6de04-default-rtdb.firebaseio.com";


/* =====================================================
   DATA
===================================================== */

let products = [];
let transactions = [];

let editingId = null;

let selectedStockFilter = "all";
let selectedCategoryFilter = "all";

let totalMoney = 0;
let soldCount = 0;

let addedMoney = 0;
let droppedMoney = 0;

let stockCurrency = "د.ع";
let exchangeRate = 1500;

let isAdmin = false;


/* =====================================================
   START
===================================================== */

window.addEventListener("load", async function(){

  isAdmin = false;

  updateInterface();

  await loadFromFirebase();

});


/* =====================================================
   FIREBASE REQUEST
===================================================== */

async function firebaseRequest(
  path,
  options={}
){

  const response =
    await fetch(
      FIREBASE_URL + path + ".json",
      {
        ...options,
        headers:{
          "Content-Type":"application/json",
          ...(options.headers || {})
        }
      }
    );


  let data = null;

  try{
    data = await response.json();
  }catch(e){}


  if(!response.ok){

    let message =
      "Firebase error " +
      response.status;


    if(
      data &&
      data.error
    ){

      message +=
        ": " +
        data.error;

    }


    throw new Error(message);

  }


  return data;

}


/* =====================================================
   FIREBASE LOAD
===================================================== */

async function loadFromFirebase(){

  try{

    const data =
      await firebaseRequest(
        "/"
      );


    console.log(
      "Firebase data:",
      data
    );


    /* PRODUCTS */

    if(
      data &&
      data.products
    ){

      if(
        Array.isArray(
          data.products
        )
      ){

        products =
          data.products
            .filter(Boolean);

      }else{

        products =
          Object.values(
            data.products
          ).filter(Boolean);

      }

    }else{

      products = [];

    }


    /* TRANSACTIONS */

    if(
      data &&
      data.transactions
    ){

      if(
        Array.isArray(
          data.transactions
        )
      ){

        transactions =
          data.transactions
            .filter(Boolean);

      }else{

        transactions =
          Object.values(
            data.transactions
          ).filter(Boolean);

      }

    }else{

      transactions = [];

    }


    /* MONEY */

    const money =
      data &&
      data.money
      ? data.money
      : {};


    totalMoney =
      Number(
        money.totalMoney
      ) || 0;


    soldCount =
      Number(
        money.soldCount
      ) || 0;


    droppedMoney =
      Number(
        money.droppedMoney
      ) || 0;


    stockCurrency =
      money.stockCurrency ||
      "د.ع";


    exchangeRate =
      Number(
        money.exchangeRate
      ) || 1500;


    recalculateStockValues();

    renderCategoryFilters();

    renderGallery();

    updateMoneyDisplay();


    console.log(
      "Loaded products:",
      products.length
    );


  }catch(error){

    console.error(
      "Firebase load error:",
      error
    );


    renderCategoryFilters();

    renderGallery();

  }

}


/* =====================================================
   SAVE PRODUCT DIRECTLY
===================================================== */

async function saveProductToFirebase(product){

  const id =
    encodeURIComponent(
      product.id
    );


  return await firebaseRequest(
    "/products/" + id,
    {
      method:"PUT",
      body:JSON.stringify(product)
    }
  );

}


/* =====================================================
   SAVE TRANSACTIONS
===================================================== */

async function saveTransactionsToFirebase(){

  const transactionObj = {};

  transactions.forEach(
    (transaction,index)=>{

      transactionObj[
        transaction.id ||
        String(index)
      ] =
        transaction;

    }
  );


  return await firebaseRequest(
    "/transactions",
    {
      method:"PUT",
      body:JSON.stringify(
        transactionObj
      )
    }
  );

}


/* =====================================================
   SAVE MONEY
===================================================== */

async function saveMoneyToFirebase(){

  return await firebaseRequest(
    "/money",
    {
      method:"PATCH",
      body:JSON.stringify({

        totalMoney:
          Number(totalMoney) || 0,

        soldCount:
          Number(soldCount) || 0,

        droppedMoney:
          Number(droppedMoney) || 0,

        stockCurrency:
          stockCurrency || "د.ع",

        exchangeRate:
          Number(exchangeRate) || 1500

      })
    }
  );

}


/* =====================================================
   IMAGE COMPRESSION
===================================================== */

function compressImage(
  file
){

  return new Promise(
    (resolve,reject)=>{

      if(
        !file ||
        !file.type.startsWith(
          "image/"
        )
      ){

        reject(
          new Error(
            "Please select an image."
          )
        );

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function(event){

          const img =
            new Image();


          img.onload =
            function(){

              const maxSize =
                1000;


              let width =
                img.width;


              let height =
                img.height;


              if(
                width > maxSize ||
                height > maxSize
              ){

                if(
                  width > height
                ){

                  height =
                    Math.round(
                      height *
                      maxSize /
                      width
                    );

                  width =
                    maxSize;

                }else{

                  width =
                    Math.round(
                      width *
                      maxSize /
                      height
                    );

                  height =
                    maxSize;

                }

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;


              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              const result =
                canvas.toDataURL(
                  "image/jpeg",
                  0.72
                );


              resolve(result);

            };


          img.onerror =
            () =>
              reject(
                new Error(
                  "Could not process image."
                )
              );


          img.src =
            event.target.result;

        };


      reader.onerror =
        () =>
          reject(
            new Error(
              "Could not read image."
            )
          );


      reader.readAsDataURL(file);

    }
  );

}

/* =====================================================
   SAVE PRODUCT
===================================================== */

async function saveProduct(){

  if(!isAdmin){

    alert(
      "Admin login required."
    );

    return;

  }


  const saveButton =
    document.getElementById(
      "saveProductBtn"
    );


  saveButton.disabled =
    true;


  saveButton.textContent =
    "Saving...";


  try{

    const name =
      document
        .getElementById(
          "name"
        )
        .value
        .trim();


    const category =
      document
        .getElementById(
          "category"
        )
        .value
        .trim();


    /*
     MODEL IS OPTIONAL
    */

    const model =
      document
        .getElementById(
          "model"
        )
        .value
        .trim();


    const quantity =
      Math.max(
        0,
        parseInt(
          document
            .getElementById(
              "quantity"
            )
            .value,
          10
        ) || 0
      );


    const buyPrice =
      Math.max(
        0,
        parseFloat(
          document
            .getElementById(
              "buyPrice"
            )
            .value
        ) || 0
      );


    const buyCurrency =
      document
        .getElementById(
          "buyCurrency"
        )
        .value;


    const sellPrice =
      Math.max(
        0,
        parseFloat(
          document
            .getElementById(
              "sellPrice"
            )
            .value
        ) || 0
      );


    const sellCurrency =
      document
        .getElementById(
          "sellCurrency"
        )
        .value;


    if(!name){

      throw new Error(
        "Please enter the item name."
      );

    }


    if(!category){

      throw new Error(
        "Please enter a category."
      );

    }


    if(sellPrice <= 0){

      throw new Error(
        "Please enter the selling price."
      );

    }


    const preview =
      document
        .getElementById(
          "productPhotoPreview"
        );


    const old =
      editingId
      ?
      products.find(
        p =>
          p.id === editingId
      )
      :
      null;


    const product = {

      id:
        editingId ||
        makeId(),

      name:
        name,

      category:
        category,

      /*
       Empty model is saved as an
       empty string. It is NOT required.
      */

      model:
        model,

      quantity:
        quantity,

      buyPrice:
        buyPrice,

      buyCurrency:
        buyCurrency,

      sellPrice:
        sellPrice,

      sellCurrency:
        sellCurrency,

      photo:
        preview.dataset.photo ||
        old?.photo ||
        null,

      createdAt:
        old?.createdAt ||
        Date.now(),

      updatedAt:
        Date.now()

    };


    console.log(
      "Saving product:",
      product
    );


    /*
     IMPORTANT FIX:
     Save ONLY this product directly
     to /products/{id}.
    */

    await saveProductToFirebase(
      product
    );


    /*
     Update local list only after
     Firebase successfully accepts it.
    */

    const index =
      products.findIndex(
        p =>
          p.id === product.id
      );


    if(index >= 0){

      products[index] =
        product;

    }else{

      products.unshift(
        product
      );

    }


    /*
     Transaction is saved separately.
    */

    transactions.unshift({

      id:
        makeId(),

      text:
        editingId
        ?
        `Edited product: ${name}`
        :
        `Added product: ${name}${model ? " (" + model + ")" : ""} - Qty: ${quantity}`,

      time:
        new Date()
          .toLocaleString()

    });


    try{

      await saveTransactionsToFirebase();

    }catch(transactionError){

      console.error(
        "Transaction save failed:",
        transactionError
      );

    }


    renderCategoryFilters();

    recalculateStockValues();

    renderGallery();

    updateMoneyDisplay();

    closeModal();


    alert(
      "Product saved successfully."
    );


  }catch(error){

    console.error(
      "SAVE PRODUCT ERROR:",
      error
    );


    alert(
      "Product was NOT saved.\n\n" +
      error.message
    );


  }finally{

    saveButton.disabled =
      false;


    saveButton.textContent =
      "Save Product";

  }

}


/* =====================================================
   ID
===================================================== */

function makeId(){

  if(
    typeof crypto !==
      "undefined" &&
    crypto.randomUUID
  ){

    try{

      return crypto.randomUUID();

    }catch(e){}

  }


  return (
    Date.now()
      .toString(36) +
    "-" +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


/* =====================================================
   GALLERY
===================================================== */

function renderGallery(){

  const grid =
    document
      .getElementById(
        "galleryGrid"
      );


  if(!grid) return;


  const search =
    document
      .getElementById(
        "gallerySearch"
      )
      .value
      .trim()
      .toLowerCase();


  const list =
    products.filter(
      p=>{

        const text =
          (
            (p.name || "") +
            " " +
            (p.model || "") +
            " " +
            (p.category || "")
          )
          .toLowerCase();


        const matchesSearch =
          text.includes(
            search
          );


        let matchesStock =
          true;


        if(
          selectedStockFilter ===
          "in"
        ){

          matchesStock =
            Number(
              p.quantity
            ) > 0;

        }


        if(
          selectedStockFilter ===
          "out"
        ){

          matchesStock =
            Number(
              p.quantity
            ) <= 0;

        }


        let matchesCategory =
          true;


        if(
          selectedCategoryFilter !==
          "all"
        ){

          matchesCategory =
            (p.category || "")
              .toLowerCase() ===
            selectedCategoryFilter
              .toLowerCase();

        }


        /*
         Visitors can see only products
         currently available.
        Admin can see everything.
        */

        if(!isAdmin){

          if(
            Number(
              p.quantity
            ) <= 0
          ){

            return false;

          }

        }


        return (
          matchesSearch &&
          matchesStock &&
          matchesCategory
        );

      }
    );


  if(!list.length){

    grid.innerHTML =
      `<div class="empty">
        No products found.
      </div>`;

    return;

  }


  grid.innerHTML =
    list.map(
      p=>{

        const quantity =
          Number(
            p.quantity
          ) || 0;


        return `

          <div
            class="product-card"
            onclick="openProduct('${escapeHTML(p.id)}')"
          >

            ${
              p.photo
              ?
              `<img
                src="${p.photo}"
                alt=""
              >`
              :
              `<div
                class="product-no-photo">
              </div>`
            }


            <div class="product-info">

              <div class="product-name">
                ${escapeHTML(
                  p.name
                )}
              </div>


              ${
                p.model
                ?
                `<div class="product-model">
                  Model:
                  ${escapeHTML(
                    p.model
                  )}
                </div>`
                :
                ""
              }


              <div class="product-category">
                ${escapeHTML(
                  p.category || ""
                )}
              </div>


              <div class="product-price">

                ${formatPrice(
                  p.sellPrice,
                  p.sellCurrency
                )}

              </div>


              ${
                isAdmin
                ?
                `<div
                  class="product-stock ${
                    quantity > 0
                    ? "in"
                    : "out"
                  }"
                >
                  ${
                    quantity > 0
                    ? "IN STOCK"
                    : "OUT OF STOCK"
                  }
                  · Qty ${quantity}
                </div>`
                :
                ""
              }

            </div>

          </div>

        `;

      }
    ).join("");

}


/* =====================================================

===================================================== */

function renderCategoryFilters(){

  const container =
    document.getElementById(
      "categoryFilters"
    );


  const datalist =
    document.getElementById(
      "categoryList"
    );


  if(!container) return;


  const categories =
    [
      ...new Set(
        products
          .map(
            p =>
              (p.category || "")
                .trim()
          )
          .filter(Boolean)
      )
    ]
    .sort(
      (a,b)=>
        a.localeCompare(
          b
        )
    );


  container.innerHTML =
    `
      <button
        id="categoryAll"
        class="${
          selectedCategoryFilter ===
          "all"
          ? "active"
          : ""
        }"
        onclick="setCategoryFilter('all')">
        All
      </button>
    `;


  categories.forEach(
    category=>{

      const safe =
        escapeHTML(
          category
        );


      container.innerHTML +=
        `
          <button
            class="${
              selectedCategoryFilter
                .toLowerCase() ===
              category.toLowerCase()
                ? "active"
                : ""
            }"
            onclick="setCategoryFilter(${JSON.stringify(category)})">
            ${safe}
          </button>
        `;

    }
  );


  if(datalist){

    datalist.innerHTML =
      categories
        .map(
          category =>
            `<option value="${escapeHTML(category)}"></option>`
        )
        .join("");

  }

}

        <div class="detail-row">

          <span class="detail-label">
            Selling price
          </span>

          <b>
            ${formatPrice(
              p.sellPrice,
              p.sellCurrency
            )}
          </b>

        </div>

      </div>


      <div class="stock-controls">

        <button
          onclick="changeStock('${escapeHTML(p.id)}',-1)"
        >
          − 1
        </button>

        <button
          onclick="changeStock('${escapeHTML(p.id)}',1)"
        >
          + 1
        </button>

        <button
          onclick="restockProduct('${escapeHTML(p.id)}')"
        >
          Restock
        </button>

      </div>


      ${
        quantity > 0
        ?
        `<button
          class="primary"
          style="width:100%;margin-top:12px"
          onclick="sellProduct('${escapeHTML(p.id)}')"
        >
          Sell Item
        </button>`
        :
        `<div
          class="empty"
          style="margin-top:12px"
        >
          This product is out of stock.
        </div>`
      }


      <div class="save-row">

        <button
          class="secondary"
          onclick="
            closeDetailModal();
            editProduct('${escapeHTML(p.id)}');
          "
        >
          Edit Product
        </button>


        <button
          class="secondary"
          onclick="closeDetailModal()"
        >
          Close
        </button>

      </div>

    `;

}


function closeDetailModal(){

  document
    .getElementById(
      "detailModal"
    )
    .classList.add(
      "hidden"
    );

}


/* =====================================================
   DELETE
===================================================== */

async function deleteProduct(
  id,
  closeAfter=false
){

  if(!isAdmin) return;


  const p =
    products.find(
      x => x.id === id
    );


  if(!p) return;


  if(
    !confirm(
      "Are you sure you want to delete this product entirely?"
    )
  ){

    return;

  }


  try{

    await firebaseRequest(
      "/products/" +
      encodeURIComponent(id),
      {
        method:"DELETE"
      }
    );


    products =
      products.filter(
        x => x.id !== id
      );


    transactions.unshift({

      id:
        makeId(),

      text:
        `Deleted product: ${p.name}`,

      time:
        new Date()
          .toLocaleString()

    });


    try{

      await saveTransactionsToFirebase();

    }catch(e){

      console.error(e);

    }


    renderCategoryFilters();

    recalculateStockValues();

    renderGallery();


    if(closeAfter){

      closeDetailModal();

    }


  }catch(error){

    alert(
      "Could not delete product.\n\n" +
      error.message
    );

  }

}


/* =====================================================
   STOCK
===================================================== */

async function changeStock(
  id,
  amount
){

  if(!isAdmin) return;


  const p =
    products.find(
      x => x.id === id
    );


  if(!p) return;


  const oldQty =
    Number(
      p.quantity
    ) || 0;


  const newQty =
    Math.max(
      0,
      oldQty + amount
    );


  const diff =
    newQty - oldQty;


  if(diff === 0) return;


  const originalQty =
    p.quantity;


  p.quantity =
    newQty;


  p.updatedAt =
    Date.now();


  try{

    await saveProductToFirebase(
      p
    );


    if(diff < 0){

      const unitVal =
        getStockUnitValue(
          p
        );


      droppedMoney +=
        Math.abs(diff) *
        unitVal;


      transactions.unshift({

        id:
          makeId(),

        text:
          `Removed ${Math.abs(diff)}x from ${p.name}`,

        time:
          new Date()
            .toLocaleString()

      });

    }


    if(diff > 0){

      transactions.unshift({

        id:
          makeId(),

        text:
          `Added ${diff}x to ${p.name}`,

        time:
          new Date()
            .toLocaleString()

      });

    }


    await saveTransactionsToFirebase();

    await saveMoneyToFirebase();


    recalculateStockValues();

    renderGallery();

    renderProductDetails(
      p
    );


  }catch(error){

    p.quantity =
      originalQty;


    alert(
      "Could not update stock.\n\n" +
      error.message
    );

  }

}


/* =====================================================
   RESTOCK
===================================================== */

async function restockProduct(
  id
){

  if(!isAdmin) return;


  const p =
    products.find(
      x => x.id === id
    );


  if(!p) return;


  const amount =
    prompt(
      "How many items do you want to restock?",
      "1"
    );


  if(amount === null) return;


  const n =
    parseInt(
      amount,
      10
    );


  if(
    !Number.isFinite(n) ||
    n <= 0
  ){

    alert(
      "Enter a valid quantity."
    );

    return;

  }


  const oldQty =
    Number(
      p.quantity
    ) || 0;


  p.quantity =
    oldQty + n;


  p.updatedAt =
    Date.now();


  try{

    await saveProductToFirebase(
      p
    );


    transactions.unshift({

      id:
        makeId(),

      text:
        `Restocked ${n}x for ${p.name}`,

      time:
        new Date()
          .toLocaleString()

    });


    await saveTransactionsToFirebase();


    recalculateStockValues();

    renderGallery();

    renderProductDetails(
      p
    );


  }catch(error){

    p.quantity =
      oldQty;


    alert(
      "Could not restock product.\n\n" +
      error.message
    );

  }

}


/* =====================================================
   SELL
===================================================== */

async function sellProduct(
  id
){

  if(!isAdmin) return;


  const p =
    products.find(
      x => x.id === id
    );


  if(!p) return;


  const quantity =
    Number(
      p.quantity
    ) || 0;


  if(quantity <= 0){

    alert(
      "This product is out of stock."
    );

    return;

  }


  const amount =
    Number(
      p.sellPrice
    ) || 0;


  if(amount <= 0){

    alert(
      "This product has no selling price."
    );

    return;

  }


  let amountIQD =
    amount;


  if(
    p.sellCurrency ===
    "USD"
  ){

    amountIQD =
      amount *
      exchangeRate;

  }


  const oldQuantity =
    p.quantity;


  const oldTotal =
    totalMoney;


  const oldSoldCount =
    soldCount;


  const oldDropped =
    droppedMoney;


  totalMoney +=
    amountIQD;


  soldCount += 1;


  const unitVal =
    getStockUnitValue(
      p
    );


  droppedMoney +=
    unitVal;


  p.quantity =
    Math.max(
      0,
      quantity - 1
    );


  p.updatedAt =
    Date.now();


  transactions.unshift({

    id:
      makeId(),

    text:
      `Sold 1x ${p.name} for ${formatPrice(
        p.sellPrice,
        p.sellCurrency
      )}`,

    time:
      new Date()
        .toLocaleString()

  });


  try{

    await saveProductToFirebase(
      p
    );


    await saveTransactionsToFirebase();

    await saveMoneyToFirebase();


    recalculateStockValues();

    renderGallery();

    renderProductDetails(
      p
    );


    alert(
      "Sale recorded successfully."
    );


  }catch(error){

    p.quantity =
      oldQuantity;


    totalMoney =
      oldTotal;


    soldCount =
      oldSoldCount;


    droppedMoney =
      oldDropped;


    transactions.shift();


    alert(
      "Sale could not be saved.\n\n" +
      error.message
    );

  }

}


/* =====================================================
   STOCK UNIT VALUE
===================================================== */

function getStockUnitValue(
  p
){

  let value =
    Number(
      p.buyPrice
    ) || 0;


  /*
   stockCurrency is stored as
   the actual currency code now.
  */

  const target =
    stockCurrency === "$"
    ? "USD"
    : "IQD";


  if(
    p.buyCurrency ===
    target
  ){

    return value;

  }


  if(
    p.buyCurrency ===
    "IQD" &&
    target ===
    "USD"
  ){

    return value /
      exchangeRate;

  }


  if(
    p.buyCurrency ===
    "USD" &&
    target ===
    "IQD"
  ){

    return value *
      exchangeRate;

  }


  return value;

}


/* =====================================================
   MONEY
===================================================== */

function recalculateStockValues(){

  addedMoney = 0;


  products.forEach(
    p=>{

      const qty =
        Number(
          p.quantity
        ) || 0;


      const price =
        Number(
          p.buyPrice
        ) || 0;


      let value =
        qty * price;


      const target =
        stockCurrency === "$"
        ? "USD"
        : "IQD";


      if(
        p.buyCurrency !==
        target
      ){

        if(
          p.buyCurrency ===
          "IQD" &&
          target ===
          "USD"
        ){

          value /=
            exchangeRate;

        }


        else if(
          p.buyCurrency ===
          "USD" &&
          target ===
          "IQD"
        ){

          value *=
            exchangeRate;

        }

      }


      addedMoney +=
        value;

    }
  );


  updateMoneyDisplay();

}


function updateMoneyDisplay(){

  document
    .getElementById(
      "totalMoney"
    )
    .textContent =
      Number(
        totalMoney
      )
      .toLocaleString(
        "en-US"
      );


  document
    .getElementById(
      "soldCount"
    )
    .textContent =
      soldCount;


  document
    .getElementById(
      "addedMoney"
    )
    .textContent =
      Number(
        addedMoney
      )
      .toLocaleString(
        "en-US",
        {
          maximumFractionDigits:2
        }
      );


  document
    .getElementById(
      "droppedMoney"
    )
    .textContent =
      Number(
        droppedMoney
      )
      .toLocaleString(
        "en-US",
        {
          maximumFractionDigits:2
        }
      );


  document
    .getElementById(
      "addedCurrencySymbol"
    )
    .textContent =
      stockCurrency;


  document
    .getElementById(
      "droppedCurrencySymbol"
    )
    .textContent =
      stockCurrency;

}


/* =====================================================
   CLEAR MONEY
===================================================== */

async function clearMoneyCard(
  type
){

  if(!isAdmin) return;


  if(
    !confirm(
      "Are you sure you want to clear this counter?"
    )
  ){

    return;

  }


  if(
    type === "earned"
  ){

    totalMoney = 0;

    soldCount = 0;

  }


  if(
    type === "dropped"
  ){

    droppedMoney = 0;

  }


  /*
   Added stock value is calculated from
   actual products, so it cannot really
   be permanently cleared without changing
   inventory values.
  */

  if(
    type === "added"
  ){

    alert(
      "Added Stock Value is calculated from your current inventory and cannot be cleared without changing the products."
    );

    return;

  }


  updateMoneyDisplay();


  try{

    await saveMoneyToFirebase();

  }catch(error){

    alert(
      "Could not save counter.\n\n" +
      error.message
    );

  }

}


/* =====================================================
   NOTIFICATIONS
===================================================== */

function openNotifications(){

  if(!isAdmin) return;


  const list =
    document
      .getElementById(
        "notifList"
      );


  if(!transactions.length){

    list.innerHTML =
      `<div class="empty">
        No transactions recorded yet.
      </div>`;

  }else{

    list.innerHTML =
      transactions
        .map(
          t=>`

          <div class="notif-item">

            <div>
              ${escapeHTML(
                t.text
              )}
            </div>

            <div class="notif-date">
              ${escapeHTML(
                t.time
              )}
            </div>

          </div>

        `
        )
        .join("");

  }


  document
    .getElementById(
      "notifModal"
    )
    .classList.remove(
      "hidden"
    );

}


async function clearNotifications(){

  if(!isAdmin) return;


  if(!transactions.length){

    alert(
      "There are no notifications to clear."
    );

    return;

  }


  if(
    !confirm(
      "Clear all transaction notifications?"
    )
  ){

    return;

  }


  try{

    await firebaseRequest(
      "/transactions",
      {
        method:"DELETE"
      }
    );


    transactions = [];


    openNotifications();


  }catch(error){

    alert(
      "Could not clear notifications.\n\n" +
      error.message
    );

  }

}


function closeNotifications(){

  document
    .getElementById(
      "notifModal"
    )
    .classList.add(
      "hidden"
    );

}


/* =====================================================
   TABS
===================================================== */

function showTab(
  tab
){

  const adminSection =
    document.getElementById(
      "adminSection"
    );


  if(
    tab === "inventory" &&
    !isAdmin
  ){

    showTab(
      "products"
    );

    return;

  }


  const navProducts =
    document.getElementById(
      "navProducts"
    );


  const navInventory =
    document.getElementById(
      "navInventory"
    );


  if(
    tab === "inventory"
  ){

    adminSection
      .classList.remove(
        "hidden"
      );


    navInventory
      .classList.add(
        "active"
      );


    navProducts
      .classList.remove(
        "active"
      );

  }else{

    if(!isAdmin){

      adminSection
        .classList.add(
          "hidden"
        );

    }


    navProducts
      .classList.add(
        "active"
      );


    navInventory
      .classList.remove(
        "active"
      );


    renderGallery();

  }

}


/* =====================================================
   FORMAT PRICE
===================================================== */

function formatPrice(
  value,
  currency
){

  const number =
    Number(
      value
    ) || 0;


  if(
    currency ===
    "USD"
  ){

    return (
      "$" +
      number.toLocaleString(
        "en-US",
        {
          maximumFractionDigits:2
        }
      )
    );

  }


  return (
    number.toLocaleString(
      "en-US",
      {
        maximumFractionDigits:0
      }
    ) +
    " د.ع"
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    function(c){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[c];

    }
  );

}
