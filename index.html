<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#111827">

<title>Center Products</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f4f6f8;
  --card:#fff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --primary:#111827;
  --green:#047857;
  --red:#b91c1c;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:20;
  background:#111827;
  color:white;
  padding:14px;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

header h1{
  margin:0;
  font-size:19px;
}

.header-actions{
  display:flex;
  gap:6px;
}

.header-btn{
  background:transparent;
  border:1px solid rgba(255,255,255,.3);
  color:white;
  border-radius:9px;
  padding:7px 9px;
  font-size:11px;
  font-weight:800;
}

/* MAIN */
main{
  max-width:1100px;
  margin:auto;
  padding:18px 16px 90px;
}

/* VISITOR */
.visitor-title{
  margin-bottom:15px;
}

.visitor-title h2{
  margin:0;
  font-size:23px;
}

.visitor-title p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
}

/* SEARCH */
.search-row{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.search{
  flex:1;
  height:46px;
  border:1px solid var(--line);
  border-radius:12px;
  background:white;
  padding:0 14px;
  outline:none;
}

.filter-btn{
  height:46px;
  border:1px solid var(--line);
  background:white;
  border-radius:12px;
  padding:0 15px;
  font-weight:800;
}

.filter-panel{
  background:white;
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px;
  margin-bottom:15px;
}

.filter-options{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.filter-options button{
  border:1px solid var(--line);
  background:white;
  border-radius:10px;
  padding:10px;
  font-weight:700;
}

.filter-options button.active{
  background:#111827;
  color:white;
}

/* PRODUCT GRID */
.product-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

@media(min-width:700px){
  .product-grid{
    grid-template-columns:repeat(4,1fr);
  }
}

.product-card{
  background:white;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
}

.product-card img,
.product-no-photo{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  background:#f1f5f9;
}

.product-info{
  padding:10px;
}

.product-name{
  font-size:13px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.product-model{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.product-price{
  margin-top:7px;
  font-size:14px;
  font-weight:900;
}

.product-stock{
  margin-top:5px;
  font-size:10px;
  font-weight:900;
}

.in{color:var(--green)}
.out{color:var(--red)}

.empty{
  background:white;
  border:1px solid var(--line);
  border-radius:15px;
  padding:25px;
  text-align:center;
  color:var(--muted);
  grid-column:1/-1;
}

/* ADMIN DASHBOARD */
.admin-panel{
  margin-bottom:20px;
}

.money-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:15px;
}

@media(max-width:768px){
  .money-grid{
    grid-template-columns:1fr;
  }
}

.money-card{
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  position:relative;
}

.card-clear-btn{
  position:absolute;
  top:12px;
  left:12px;
  background:#f1f5f9;
  border:0;
  border-radius:6px;
  padding:3px 8px;
  font-size:10px;
  font-weight:800;
  color:var(--muted);
}

.money-content{
  margin-top:16px;
}

.money-label{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

.money-value{
  margin-top:4px;
  font-size:24px;
  font-weight:900;
}

.money-count{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

.text-red{color:var(--red)}

.action-grid{
  display:grid;
  gap:10px;
  margin-bottom:15px;
}

.action-btn{
  width:100%;
  border-radius:14px;
  padding:16px;
  border:0;
  text-align:left;
  font-weight:800;
}

.action-btn small{
  display:block;
  margin-top:4px;
  opacity:.7;
  font-weight:500;
}

.action-add{
  background:#111827;
  color:white;
}

/* NAV */
.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  display:flex;
  justify-content:center;
  background:white;
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}

.nav-btn{
  width:50%;
  max-width:280px;
  padding:14px 8px;
  border:0;
  background:white;
  color:#6b7280;
  font-weight:800;
}

.nav-btn.active{
  color:#111827;
  border-top:2px solid #111827;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  background:rgba(0,0,0,.58);
}

.modal-box{
  width:min(620px,100%);
  max-height:94vh;
  overflow:auto;
  background:white;
  border-radius:22px 22px 0 0;
  padding:20px 16px 30px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.modal-head h2{
  margin:0;
  font-size:21px;
}

.close{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:#f1f5f9;
  font-size:22px;
}

/* LOGIN */
.login-box{
  width:min(400px,100%);
  margin:auto;
  padding:25px;
}

.login-box input{
  width:100%;
  height:48px;
  border:1px solid var(--line);
  border-radius:11px;
  padding:0 12px;
  text-align:center;
  letter-spacing:2px;
}

.primary{
  background:#111827;
  color:white;
  border:0;
  border-radius:12px;
  padding:13px;
  font-weight:800;
}

.secondary{
  background:white;
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  font-weight:800;
}

.danger{
  background:#fee2e2;
  color:#991b1b;
  border:0;
  border-radius:12px;
  padding:13px;
  font-weight:800;
}

/* FORM */
.photo-preview{
  width:100%;
  height:280px;
  object-fit:cover;
  border-radius:16px;
  background:#111827;
}

.fields{
  display:grid;
  gap:13px;
  margin-top:17px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin-bottom:6px;
}

.field input,
.field select{
  width:100%;
  height:45px;
  border:1px solid var(--line);
  border-radius:11px;
  background:white;
  padding:0 12px;
  outline:none;
}

.save-row{
  display:flex;
  gap:9px;
  margin-top:18px;
}

.save-row button{flex:1}

/* DETAILS */
.detail-photo{
  width:100%;
  max-height:430px;
  object-fit:contain;
  background:#f1f5f9;
  border-radius:16px;
  display:block;
}

.detail-card{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px;
  margin-top:14px;
}

.detail-name{
  font-size:22px;
  font-weight:900;
}

.detail-model{
  color:var(--muted);
  margin-top:4px;
}

.detail-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid var(--line);
}

.detail-row:last-child{
  border-bottom:0;
}

.detail-label{
  color:#6b7280;
}

.stock-controls{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.stock-controls button{
  border:1px solid var(--line);
  background:white;
  border-radius:10px;
  padding:10px;
  font-weight:800;
}

.notif-item{
  padding:10px 0;
  border-bottom:1px solid var(--line);
  font-size:13px;
}

.notif-date{
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

.notification-actions{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.notification-actions button{
  flex:1;
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <h1>Center Products</h1>

    <div class="header-actions">
      <button class="header-btn" id="adminLoginBtn" onclick="openAdminLogin()">
        🔐 Admin
      </button>

      <button class="header-btn hidden" id="notifBtn" onclick="openNotifications()">
        🔔 Log
      </button>

      <button class="header-btn hidden" id="lockBtn" onclick="logoutAdmin()">
        Lock
      </button>
    </div>
  </div>
</header>


<main>

<!-- =====================================================
     VISITOR PRODUCTS
===================================================== -->

<section id="visitorSection">

  <div class="visitor-title">
    <h2>Available Products</h2>
    <p>Browse our products and check prices.</p>
  </div>

  <div class="search-row">
    <input
      id="gallerySearch"
      class="search"
      type="search"
      placeholder="Search product name or model..."
      oninput="renderGallery()"
    >

    <button class="filter-btn" onclick="toggleFilter()">
      Filter
    </button>
  </div>

  <div id="filterPanel" class="filter-panel hidden">

    <div class="filter-options">

      <button
        id="filterAll"
        class="active"
        onclick="setStockFilter('all')">
        All
      </button>

      <button
        id="filterIn"
        onclick="setStockFilter('in')">
        In Stock
      </button>

      <button
        id="filterOut"
        onclick="setStockFilter('out')">
        Out of Stock
      </button>

    </div>

  </div>

  <div id="galleryGrid" class="product-grid"></div>

</section>


<!-- =====================================================
     ADMIN DASHBOARD
===================================================== -->

<section id="adminSection" class="admin-panel hidden">

  <div class="money-grid">

    <div class="money-card">
      <button class="card-clear-btn"
              onclick="clearMoneyCard('earned')">
        Clear
      </button>

      <div class="money-content">
        <div class="money-label">
          Total Money Earned
        </div>

        <div class="money-value">
          <span id="totalMoney">0</span>
          د.ع
        </div>

        <div class="money-count">
          <span id="soldCount">0</span> items sold
        </div>
      </div>
    </div>


    <div class="money-card">

      <button class="card-clear-btn"
              onclick="clearMoneyCard('added')">
        Clear
      </button>

      <div class="money-content">

        <div class="money-label">
          Added Stock Value
        </div>

        <div class="money-value">
          <span id="addedMoney">0</span>
          <span id="addedCurrencySymbol">د.ع</span>
        </div>

        <div class="money-count">
          Active inventory value
        </div>

      </div>
    </div>


    <div class="money-card">

      <button class="card-clear-btn"
              onclick="clearMoneyCard('dropped')">
        Clear
      </button>

      <div class="money-content">

        <div class="money-label">
          Stock Value Drop
        </div>

        <div class="money-value text-red">
          <span id="droppedMoney">0</span>
          <span id="droppedCurrencySymbol">د.ع</span>
        </div>

        <div class="money-count">
          Sold / removed cost
        </div>

      </div>
    </div>

  </div>


  <div class="action-grid">

    <button class="action-btn action-add"
            onclick="scanForAdd()">

      Add Product

      <small>
        Add photo, name, model, quantity, purchase price and selling price
      </small>

    </button>

  </div>

</section>

</main>


<!-- =====================================================
     BOTTOM NAV
===================================================== -->

<nav class="bottom-nav">

  <button
    id="navProducts"
    class="nav-btn active"
    onclick="showTab('products')">
    Products
  </button>

  <button
    id="navInventory"
    class="nav-btn hidden"
    onclick="showTab('inventory')">
    Inventory
  </button>

</nav>


<!-- FILE INPUT -->

<input
  id="scanInput"
  type="file"
  accept="image/*"
  hidden
>


<!-- =====================================================
     ADMIN LOGIN MODAL
===================================================== -->

<div
  id="adminLoginModal"
  class="modal hidden"
  onclick="if(event.target===this) closeAdminLogin()">

  <div class="modal-box">

    <div class="modal-head">
      <h2>Admin Login</h2>

      <button
        class="close"
        onclick="closeAdminLogin()">
        ×
      </button>
    </div>

    <div class="login-box">

      <input
        id="adminPasscode"
        type="password"
        autocomplete="off"
        placeholder="Admin password"
      >

      <button
        class="primary"
        style="width:100%;margin-top:12px"
        onclick="adminLogin()">
        Login
      </button>

      <div
        id="adminLoginError"
        style="color:#b91c1c;text-align:center;margin-top:10px;font-size:13px;font-weight:700">
      </div>

    </div>

  </div>
</div>


<!-- =====================================================
     ADD PRODUCT MODAL
===================================================== -->

<div
  id="productModal"
  class="modal hidden"
  onclick="if(event.target===this) closeModal()">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle">
        Add Product
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>


    <img
      id="productPhotoPreview"
      class="photo-preview hidden"
      alt="Product"
    >


    <div class="fields">

      <div class="field">

        <label>
          Item name
        </label>

        <input
          id="name"
          type="text"
          placeholder="Example: iPhone 15 Pro Max Cover"
        >

      </div>


      <div class="field">

        <label>
          Model
        </label>

        <input
          id="model"
          type="text"
          placeholder="Example: 15 Pro Max"
        >

      </div>


      <div class="field">

        <label>
          Quantity
        </label>

        <input
          id="quantity"
          type="number"
          min="0"
          step="1"
          value="1"
        >

      </div>


      <div class="field">

        <label>
          Purchase price per item
        </label>

        <input
          id="buyPrice"
          type="number"
          min="0"
          step="0.01"
          placeholder="0"
        >

      </div>


      <div class="field">

        <label>
          Purchase currency
        </label>

        <select id="buyCurrency">

          <option value="IQD">
            د.ع
          </option>

          <option value="USD">
            $
          </option>

        </select>

      </div>


      <!-- NEW SELLING PRICE -->

      <div class="field">

        <label>
          Selling price per item
        </label>

        <input
          id="sellPrice"
          type="number"
          min="0"
          step="0.01"
          placeholder="Example: 25000"
        >

      </div>


      <div class="field">

        <label>
          Selling currency
        </label>

        <select id="sellCurrency">

          <option value="IQD">
            د.ع
          </option>

          <option value="USD">
            $
          </option>

        </select>

      </div>

    </div>


    <div class="save-row">

      <button
        class="secondary"
        onclick="closeModal()">
        Cancel
      </button>

      <button
        class="primary"
        onclick="saveProduct()">
        Save Product
      </button>

    </div>

  </div>
</div>


<!-- =====================================================
     PRODUCT DETAILS
===================================================== -->

<div
  id="detailModal"
  class="modal hidden"
  onclick="if(event.target===this) closeDetailModal()">

  <div class="modal-box">

    <div class="modal-head">

      <h2>
        Product
      </h2>

      <button
        class="close"
        onclick="closeDetailModal()">
        ×
      </button>

    </div>

    <div id="detailContent"></div>

  </div>
</div>


<!-- =====================================================
     NOTIFICATIONS
===================================================== -->

<div
  id="notifModal"
  class="modal hidden"
  onclick="if(event.target===this) closeNotifications()">

  <div class="modal-box">

    <div class="modal-head">

      <h2>
        Transaction History
      </h2>

      <button
        class="close"
        onclick="closeNotifications()">
        ×
      </button>

    </div>


    <div class="notification-actions">

      <button
        class="danger"
        onclick="clearNotifications()">
        Clear Notifications
      </button>

      <button
        class="secondary"
        onclick="closeNotifications()">
        Close
      </button>

    </div>


    <div id="notifList"></div>

  </div>
</div>


<script>

/* =====================================================
   SETTINGS
===================================================== */

const PASSCODE = "165naseh";

/*
 IMPORTANT:
 This is your Firebase Realtime Database URL.
*/
const FIREBASE_URL =
"https://store-products-6de04-default-rtdb.firebaseio.com";


/* =====================================================
   DATA
===================================================== */

let products = [];
let transactions = [];

let editingId = null;

let selectedStockFilter = "all";

let totalMoney = 0;
let soldCount = 0;

let addedMoney = 0;
let droppedMoney = 0;

let stockCurrency = "د.ع";
let exchangeRate = 1500;

let isAdmin = false;

let firebaseTimer = null;


/* =====================================================
   START
===================================================== */

window.addEventListener("load", async function(){

  /*
   Visitor mode is ALWAYS the default.
  */

  isAdmin = false;

  updateInterface();

  await loadFromFirebase();

});


/* =====================================================
   FIREBASE LOAD
===================================================== */

async function loadFromFirebase(){

  try{

    const response =
      await fetch(FIREBASE_URL + "/.json", {
        cache:"no-store"
      });

    if(!response.ok){
      throw new Error(
        "Firebase HTTP error: " + response.status
      );
    }

    const data = await response.json();

    console.log("Firebase data:", data);


    /*
     Products
    */

    if(data && data.products){

      if(Array.isArray(data.products)){

        products = data.products.filter(Boolean);

      }else{

        products = Object.values(data.products)
          .filter(Boolean);

      }

    }else{

      products = [];

    }


    /*
     Transactions
    */

    if(data && Array.isArray(data.transactions)){

      transactions = data.transactions;

    }else{

      transactions = [];

    }


    /*
     Money
    */

    const money =
      data && data.money
      ? data.money
      : {};


    totalMoney =
      Number(money.totalMoney) || 0;

    soldCount =
      Number(money.soldCount) || 0;

    droppedMoney =
      Number(money.droppedMoney) || 0;

    stockCurrency =
      money.stockCurrency || "د.ع";

    exchangeRate =
      Number(money.exchangeRate) || 1500;


    recalculateStockValues();

    renderGallery();

    updateMoneyDisplay();

    console.log(
      "Loaded products:",
      products.length
    );


  }catch(error){

    console.error(
      "Firebase load error:",
      error
    );

    /*
     DO NOT destroy existing local data
     if Firebase temporarily fails.
    */

    renderGallery();

  }

}


/* =====================================================
   FIREBASE SAVE
===================================================== */

async function saveToFirebase(){

  try{

    const productsObj = {};

    /*
     Firebase needs a proper object
     with product IDs as keys.
    */

    products.forEach(product => {

      if(product && product.id){

        productsObj[product.id] = product;

      }

    });


    const payload = {

      products: productsObj,

      transactions: transactions,

      money: {

        totalMoney: Number(totalMoney) || 0,

        soldCount: Number(soldCount) || 0,

        droppedMoney:
          Number(droppedMoney) || 0,

        stockCurrency:
          stockCurrency || "د.ع",

        exchangeRate:
          Number(exchangeRate) || 1500

      }

    };


    console.log(
      "Saving Firebase:",
      payload
    );


    const response =
      await fetch(FIREBASE_URL + "/.json", {

        method:"PUT",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify(payload)

      });


    if(!response.ok){

      throw new Error(
        "Firebase save HTTP error: " +
        response.status
      );

    }


    const result =
      await response.json();

    console.log(
      "Firebase save successful:",
      result
    );

    return true;


  }catch(error){

    console.error(
      "Firebase SAVE ERROR:",
      error
    );

    alert(
      "Could not save to Firebase.\n\n" +
      error.message
    );

    return false;

  }

}


/* =====================================================
   ADMIN LOGIN
===================================================== */

function openAdminLogin(){

  document
    .getElementById("adminLoginModal")
    .classList.remove("hidden");

  setTimeout(()=>{

    document
      .getElementById("adminPasscode")
      .focus();

  },100);

}


function closeAdminLogin(){

  document
    .getElementById("adminLoginModal")
    .classList.add("hidden");

  document
    .getElementById("adminPasscode")
    .value = "";

  document
    .getElementById("adminLoginError")
    .textContent = "";

}


function adminLogin(){

  const password =
    document
      .getElementById("adminPasscode")
      .value;


  if(password !== PASSCODE){

    document
      .getElementById("adminLoginError")
      .textContent =
        "Incorrect password.";

    return;

  }


  isAdmin = true;

  sessionStorage.setItem(
    "inventoryAdmin",
    "1"
  );


  closeAdminLogin();

  updateInterface();

  showTab("inventory");

}

===================================================== */

function logoutAdmin(){

  );

  updateInterface();

}

}


/* =====================================================
   IMAGE
===================================================== */

function readImage(file){

  return new Promise((resolve,reject)=>{

    const reader =
      new FileReader();

    reader.onload = () =>
      resolve(reader.result);

    reader.onerror = () =>
      reject(reader.error);

    reader.readAsDataURL(file);

  });

}


function scanForAdd(){

  if(!isAdmin){

    alert("Admin login required.");

    return;

  }

  document
    .getElementById("scanInput")
    .click();

}


document
  .getElementById("scanInput")
  .addEventListener(
    "change",
    async function(){

      const file =
        this.files &&
        this.files[0];

      if(!file) return;


      try{

        const image =
          await readImage(file);

        openAddProduct(image);

      }catch(error){

        alert(
          "Could not read image."
        );

      }

      this.value = "";

    }
  );

/* =====================================================
   EDIT PRODUCT
===================================================== */

function editProduct(id){

  if(!isAdmin) return;


  const p =
    products.find(
      x => x.id === id
    );


  if(!p) return;


  editingId = id;


  document
    .getElementById("modalTitle")
    .textContent =
      "Edit Product";


  document
    .getElementById("name")
    .value =
      p.name || "";


  document
    .getElementById("model")
    .value =
      p.model || "";


  document
    .getElementById("quantity")
    .value =
      Number(p.quantity) || 0;


  document
    .getElementById("buyPrice")
    .value =
      Number(p.buyPrice) || 0;


  document
    .getElementById("buyCurrency")
    .value =
      p.buyCurrency || "IQD";


  document
    .getElementById("sellPrice")
    .value =
      Number(p.sellPrice) || 0;


  document
    .getElementById("sellCurrency")
    .value =
      p.sellCurrency || "IQD";


  const preview =
    document
      .getElementById("productPhotoPreview");


  if(p.photo){

    preview.src = p.photo;

    preview.dataset.photo =
      p.photo;

    preview.classList.remove(
      "hidden"
    );

  }else{

    preview.classList.add(
      "hidden"
    );

  }


  document
    .getElementById("productModal")
    .classList.remove("hidden");

}


function closeModal(){

  document
    .getElementById("productModal")
    .classList.add("hidden");

  editingId = null;

}


/* =====================================================
   SAVE PRODUCT
===================================================== */

async function saveProduct(){

  if(!isAdmin){

    alert(
      "Admin login required."
    );

    return;

  }


  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const model =
    document
      .getElementById("model")
      .value
      .trim();


  const quantity =
    Math.max(
      0,
      parseInt(
        document
          .getElementById("quantity")
          .value,
        10
      ) || 0
    );


  const buyPrice =
    Math.max(
      0,
      parseFloat(
        document
          .getElementById("buyPrice")
          .value
      ) || 0
    );


  const buyCurrency =
    document
      .getElementById("buyCurrency")
      .value;


  const sellPrice =
    Math.max(
      0,
      parseFloat(
        document
          .getElementById("sellPrice")
          .value
      ) || 0
    );


  const sellCurrency =
    document
      .getElementById("sellCurrency")
      .value;


  if(!name){

    alert(
      "Please enter the item name."
    );

    return;

  }


  if(!model){

    alert(
      "Please enter the model."
    );

    return;

  }


  if(sellPrice <= 0){

    alert(
      "Please enter the selling price."
    );

    return;

  }


  const preview =
    document
      .getElementById(
        "productPhotoPreview"
      );


  const old =
    editingId
      ? products.find(
          p => p.id === editingId
        )
      : null;


  const product = {

    id:
      editingId ||
      makeId(),

    name:name,

    model:model,

    quantity:quantity,

    buyPrice:buyPrice,

    buyCurrency:buyCurrency,

    sellPrice:sellPrice,

    sellCurrency:sellCurrency,

    photo:
      preview.dataset.photo ||
      old?.photo ||
      null,

    createdAt:
      old?.createdAt ||
      Date.now(),

    updatedAt:
      Date.now()

  };


  const index =
    products.findIndex(
      p => p.id === product.id
    );


  if(index >= 0){

    products[index] =
      product;

    logTransaction(
      `Edited product: ${name}`
    );

  }else{

    products.unshift(
      product
    );

    logTransaction(
      `Added product: ${name} (${model}) - Qty: ${quantity}`
    );

  }


  /*
   IMPORTANT:
   Save BEFORE closing the modal.
   If Firebase fails, user knows immediately.
  */

  const saved =
    await saveToFirebase();


  if(!saved){

    /*
     If save failed, reload Firebase
     so local state isn't misleading.
    */

    await loadFromFirebase();

    return;

  }


  closeModal();

  recalculateStockValues();

  renderGallery();

  updateMoneyDisplay();


  alert(
    "Product saved successfully."
  );

}


/* =====================================================
   ID
===================================================== */

function makeId(){

  if(
    typeof crypto !== "undefined" &&
    crypto.randomUUID
  ){

    try{
      return crypto.randomUUID();
    }catch(e){}

  }


  return (
    Date.now().toString(36) +
    "-" +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


/* =====================================================
   GALLERY
===================================================== */

function renderGallery(){

  const grid =
    document
      .getElementById(
        "galleryGrid"
      );


  if(!grid) return;


  const search =
    document
      .getElementById(
        "gallerySearch"
      )
      .value
      .trim()
      .toLowerCase();


  const list =
    products.filter(p=>{

      const text =
        (
          (p.name || "") +
          " " +
          (p.model || "")
        )
        .toLowerCase();


      const matchesSearch =
        text.includes(search);


      let matchesStock = true;


      if(
        selectedStockFilter === "in"
      ){

        matchesStock =
          Number(p.quantity) > 0;

      }


      if(
        selectedStockFilter === "out"
      ){

        matchesStock =
          Number(p.quantity) <= 0;

      }


      return (
        matchesSearch &&
        matchesStock
      );

    });


  if(!list.length){

    grid.innerHTML =
      `<div class="empty">
        No products found.
      </div>`;

    return;

  }


  grid.innerHTML =
    list.map(p=>{

      const quantity =
        Number(p.quantity) || 0;


      return `

        <div
          class="product-card"
          onclick="openProduct('${escapeHTML(p.id)}')"
        >

          ${
            p.photo

            ?

            `<img
              src="${p.photo}"
              alt=""
            >`

            :

            `<div class="product-no-photo"></div>`
          }


          <div class="product-info">

            <div class="product-name">
              ${escapeHTML(p.name)}
            </div>


            <div class="product-model">
              Model: ${escapeHTML(p.model || "-")}
            </div>


            <div class="product-price">
              ${formatPrice(
                p.sellPrice,
                p.sellCurrency
              )}
            </div>


            <div
              class="product-stock ${
                quantity > 0
                  ? "in"
                  : "out"
              }"
            >
              ${
                quantity > 0
                  ? "IN STOCK"
                  : "OUT OF STOCK"
              }
            </div>

          </div>

        </div>

      `;

    }).join("");

}

function toggleFilter(){

  document
    .getElementById("filterPanel")
    .classList.toggle(
      "hidden"
    );

}


function setStockFilter(value){

  selectedStockFilter =
    value;


  document
    .getElementById(
      "filterAll"
    )
    .classList.remove("active");


  document
    .getElementById(
      "filterIn"
    )
    .classList.remove("active");


  document
    .getElementById(
      "filterOut"
    )
    .classList.remove("active");


  if(value === "all"){

    document
      .getElementById(
        "filterAll"
      )
      .classList.add("active");

  }


  if(value === "in"){

    document
      .getElementById(
        "filterIn"
      )
      .classList.add("active");

  }


  if(value === "out"){

    document
      .getElementById(
        "filterOut"
      )
      .classList.add("active");

  }


  renderGallery();

}

/* =====================================================
   DELETE
===================================================== */

async function deleteProduct(
  id,
  closeAfter=false
){

  if(!isAdmin) return;


  const p =
    products.find(
      x => x.id === id
    );


  if(!p) return;


  if(
    !confirm(
      "Are you sure you want to delete this product entirely?"
    )
  ){

    return;

  }


  products =
    products.filter(
      x => x.id !== id
    );


  transactions.unshift({

    text:
      `Deleted product: ${p.name}`,

    time:
      new Date().toLocaleString()

  });


  const saved =
    await saveToFirebase();


  if(!saved){

    await loadFromFirebase();

    return;

  }


  renderGallery();

  recalculateStockValues();


  if(closeAfter){

    closeDetailModal();

  }

}


/* =====================================================
   STOCK
===================================================== */

async function changeStock(
  id,
  amount
){

  if(!isAdmin) return;


  const p =
    products.find(
      x => x.id === id
    );


  if(!p) return;


  const oldQty =
    Number(p.quantity) || 0;


  const newQty =
    Math.max(
      0,
      oldQty + amount
    );


  const diff =
    newQty - oldQty;


  if(diff === 0) return;


  p.quantity =
    newQty;


  p.updatedAt =
    Date.now();


  let unitVal =
    Number(p.buyPrice) || 0;


  if(
    p.buyCurrency !==
    stockCurrency
  ){

    if(
      p.buyCurrency === "IQD" &&
      stockCurrency === "$"
    ){

      unitVal /=
        exchangeRate;

    }

    else if(
      p.buyCurrency === "USD" &&
      stockCurrency === "د.ع"
    ){

      unitVal *=
        exchangeRate;

    }

  }


  if(diff < 0){

    droppedMoney +=
      Math.abs(diff) *
      unitVal;


    transactions.unshift({

      text:
        `Removed ${Math.abs(diff)}x from ${p.name}`,

      time:
        new Date().toLocaleString()

    });

  }


  if(diff > 0){

    transactions.unshift({

      text:
        `Added ${diff}x to ${p.name}`,

      time:
        new Date().toLocaleString()

    });

  }


  const saved =
    await saveToFirebase();


  if(!saved){

    await loadFromFirebase();

    return;

  }


  recalculateStockValues();

  renderGallery();

  renderProductDetails(p);

}


/* =====================================================
   RESTOCK
===================================================== */

async function restockProduct(id){

  if(!isAdmin) return;


  const p =
    products.find(
      x => x.id === id
    );


  if(!p) return;


  const amount =
    prompt(
      "How many items do you want to restock?",
      "1"
    );


  if(amount === null) return;


  const n =
    parseInt(
      amount,
      10
    );


  if(
    !Number.isFinite(n) ||
    n <= 0
  ){

    alert(
      "Enter a valid quantity."
    );

    return;

  }


  p.quantity =
    (Number(p.quantity) || 0) +
    n;


  p.updatedAt =
    Date.now();


  transactions.unshift({

    text:
      `Restocked ${n}x for ${p.name}`,

    time:
      new Date().toLocaleString()

  });


  const saved =
    await saveToFirebase();


  if(!saved){

    await loadFromFirebase();

    return;

  }


  recalculateStockValues();

  renderGallery();

  renderProductDetails(p);

}


/* =====================================================
   SELL
===================================================== */

async function sellProduct(id){

  if(!isAdmin) return;


  const p =
    products.find(
      x => x.id === id
    );


  if(!p) return;


  const quantity =
    Number(p.quantity) || 0;


  if(quantity <= 0){

    alert(
      "This product is out of stock."
    );

    return;

  }


  /*
   Now the selling price is already saved.
   So the admin doesn't need to enter it
   every time.
  */

  let amount =
    Number(p.sellPrice) || 0;


  if(amount <= 0){

    alert(
      "This product has no selling price."
    );

    return;

  }


  /*
   Convert selling price to IQD
   for Total Money Earned.
  */

  let amountIQD =
    amount;


  if(
    p.sellCurrency === "USD"
  ){

    amountIQD =
      amount *
      exchangeRate;

  }


  totalMoney +=
    amountIQD;


  soldCount += 1;


  let unitVal =
    Number(p.buyPrice) || 0;


  if(
    p.buyCurrency !==
    stockCurrency
  ){

    if(
      p.buyCurrency === "IQD" &&
      stockCurrency === "$"
    ){

      unitVal /=
        exchangeRate;

    }

    else if(
      p.buyCurrency === "USD" &&
      stockCurrency === "د.ع"
    ){

      unitVal *=
        exchangeRate;

    }

  }


  droppedMoney +=
    unitVal;


  p.quantity =
    Math.max(
      0,
      quantity - 1
    );


  p.updatedAt =
    Date.now();


  transactions.unshift({

    text:
      `Sold 1x ${p.name} for ${formatPrice(
        p.sellPrice,
        p.sellCurrency
      )}`,

    time:
      new Date().toLocaleString()

  });


  const saved =
    await saveToFirebase();


  if(!saved){

    await loadFromFirebase();

    return;

  }


  recalculateStockValues();

  renderGallery();

  renderProductDetails(p);


  alert(
    "Sale recorded successfully."
  );

}


/* =====================================================
   MONEY
===================================================== */

function recalculateStockValues(){

  addedMoney = 0;


  products.forEach(p=>{

    const qty =
      Number(p.quantity) || 0;


    const price =
      Number(p.buyPrice) || 0;


    let value =
      qty * price;


    if(
      p.buyCurrency !==
      stockCurrency
    ){

      if(
        p.buyCurrency === "IQD" &&
        stockCurrency === "$"
      ){

        value /=
          exchangeRate;

      }

      else if(
        p.buyCurrency === "USD" &&
        stockCurrency === "د.ع"
      ){

        value *=
          exchangeRate;

      }

    }


    addedMoney +=
      value;

  });


  updateMoneyDisplay();

}


function updateMoneyDisplay(){

  document
    .getElementById(
      "totalMoney"
    )
    .textContent =
      Number(totalMoney)
        .toLocaleString("en-US");


  document
    .getElementById(
      "soldCount"
    )
    .textContent =
      soldCount;


  document
    .getElementById(
      "addedMoney"
    )
    .textContent =
      Number(addedMoney)
        .toLocaleString(
          "en-US",
          {
            maximumFractionDigits:2
          }
        );


  document
    .getElementById(
      "droppedMoney"
    )
    .textContent =
      Number(droppedMoney)
        .toLocaleString(
          "en-US",
          {
            maximumFractionDigits:2
          }
        );


  document
    .getElementById(
      "addedCurrencySymbol"
    )
    .textContent =
      stockCurrency;


  document
    .getElementById(
      "droppedCurrencySymbol"
    )
    .textContent =
      stockCurrency;

}


async function clearMoneyCard(type){

  if(!isAdmin) return;


  if(
    !confirm(
      "Are you sure you want to clear this counter?"
    )
  ){

    return;

  }


  if(type === "earned"){

    totalMoney = 0;

    soldCount = 0;

  }


  if(type === "added"){

    /*
     This is recalculated from products,
     so clearing it should mean resetting
     the displayed value only.
    */

    addedMoney = 0;

  }


  if(type === "dropped"){

    droppedMoney = 0;

  }


  updateMoneyDisplay();

  await saveToFirebase();

}


/* =====================================================
   NOTIFICATIONS
===================================================== */

function openNotifications(){

  if(!isAdmin) return;


  const list =
    document
      .getElementById(
        "notifList"
      );


  if(!transactions.length){

    list.innerHTML =
      `<div class="empty">
        No transactions recorded yet.
      </div>`;

  }else{

    list.innerHTML =
      transactions.map(t=>`

        <div class="notif-item">

          <div>
            ${escapeHTML(t.text)}
          </div>

          <div class="notif-date">
            ${escapeHTML(t.time)}
          </div>

        </div>

      `).join("");

  }


  document
    .getElementById(
      "notifModal"
    )
    .classList.remove(
      "hidden"
    );

}


async function clearNotifications(){

  if(!isAdmin) return;


  if(!transactions.length){

    alert(
      "There are no notifications to clear."
    );

    return;

  }


  if(
    !confirm(
      "Clear all transaction notifications?"
    )
  ){

    return;

  }


  transactions = [];


  const saved =
    await saveToFirebase();


  if(!saved){

    await loadFromFirebase();

    return;

  }


  openNotifications();

}


function closeNotifications(){

  document
    .getElementById(
      "notifModal"
    )
    .classList.add(
      "hidden"
    );

}


/* =====================================================
   TABS
===================================================== */

function showTab(tab){

  const adminSection =
    document.getElementById(
      "adminSection"
    );


  if(
    tab === "inventory" &&
    !isAdmin
  ){

    showTab("products");

    return;

  }


  const navProducts =
    document.getElementById(
      "navProducts"
    );


  const navInventory =
    document.getElementById(
      "navInventory"
    );


  if(tab === "inventory"){

    adminSection
      .classList.remove(
        "hidden"
      );


    navInventory
      .classList.add(
        "active"
      );


    navProducts
      .classList.remove(
        "active"
      );

  }else{

    if(!isAdmin){

      adminSection
        .classList.add(
          "hidden"
        );

    }


    navProducts
      .classList.add(
        "active"
      );


    navInventory
      .classList.remove(
        "active"
      );


    renderGallery();

  }

}


/* =====================================================
   FORMAT
===================================================== */

function formatPrice(
  value,
  currency
){

  const number =
    Number(value) || 0;


  if(currency === "USD"){

    return (
      "$" +
      number.toLocaleString(
        "en-US",
        {
          maximumFractionDigits:2
        }
      )
    );

  }


  return (
    number.toLocaleString(
      "en-US",
      {
        maximumFractionDigits:0
      }
    ) +
    " د.ع"
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    function(c){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[c];

    }
  );

}
